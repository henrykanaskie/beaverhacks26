<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AccliMate</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-deep:   #16161e;
      --bg-main:   #1e1e2e;
      --bg-raised: #24243a;
      --bg-hover:  #2d2d45;
      --bg-active: #333350;
      --border:    rgba(255,255,255,0.07);
      --border-md: rgba(255,255,255,0.12);
      --text-1: #e4e4f0;
      --text-2: #9898b8;
      --text-3: #55556a;
      --blue:   #7aa2f7;
      --purple: #bb9af7;
      --purple-warm: #c68cf6;
      --cyan:   #7dcfff;
      --green:  #9ece6a;
      --yellow: #e0af68;
      --red:    #f7768e;
      --font-ui:   'Inter', system-ui, sans-serif;
      --font-code: 'JetBrains Mono', 'Fira Code', Consolas, monospace;
    }

    html, body {
      height: 100%;
      background: var(--bg-main); color: var(--text-1);
      font-family: var(--font-ui); font-size: 14px; line-height: 1.5;
    }
    body { display: flex; flex-direction: column; }

    /* ── Top bar ── */
    #topbar {
      height: 40px; background: var(--bg-deep);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; padding: 0 16px; gap: 10px;
      flex-shrink: 0;
    }
    .logo { font-size: 13px; font-weight: 600; color: var(--purple-warm); letter-spacing: .02em; }
    .logo-img { mix-blend-mode: normal; }
    .repo { font-family: var(--font-code); font-size: 12px; color: var(--text-2); }
    .sep  { color: var(--text-3); }

    /* ── Centering wrapper ── */
    #content {
      flex: 1;
      display: flex; align-items: center; justify-content: center;
      padding: 40px 24px;
    }

    /* ── Shell ── */
    #app {
      width: 100%; max-width: 520px;
      display: flex; flex-direction: column; gap: 40px;
    }

    /* ── Index section (no card, left-aligned) ── */
    #index-section {
      display: flex; flex-direction: column; align-items: flex-start;
    }
    #index-section h1 {
      font-size: 36px; font-weight: 700;
      font-family: 'Space Mono', monospace;
      color: var(--text-1); letter-spacing: .02em;
      margin-bottom: 8px;
      display: inline-flex; align-items: center;
    }
    .hero-title-type {
      color: var(--purple-warm);
      white-space: nowrap;
      overflow: hidden;
      display: inline-block;
      width: 0;
      border-right: 2px solid rgba(198, 140, 246, 0.95);
      animation:
        hero-typing 1.1s steps(9, end) 0.15s forwards,
        hero-caret .9s steps(1, end) 0s infinite;
    }
    @keyframes hero-typing {
      from { width: 0; }
      to   { width: 210px; }
    }
    @keyframes hero-caret {
      0%, 49% { border-right-color: rgba(198, 140, 246, 0.95); }
      50%, 100% { border-right-color: transparent; }
    }
    @media (prefers-reduced-motion: reduce) {
      .hero-title-type {
        animation: none;
        width: auto;
        border-right: none;
      }
    }
    .subtitle {
      font-size: 13px; color: var(--text-2); margin-bottom: 28px;
    }

    #repo-form {
      display: flex; gap: 8px; align-items: stretch;
      width: 100%;
      background: var(--bg-raised); border: 1px solid var(--border-md);
      border-radius: 8px; padding: 6px;
      transition: border-color .15s;
    }
    #repo-form:focus-within { border-color: rgba(122,162,247,.4); }

    #repo-url {
      flex: 1; min-width: 0;
      background: none; border: none; outline: none;
      color: var(--text-1);
      font-family: var(--font-code); font-size: 13px;
      padding: 8px 10px;
    }
    #repo-url::placeholder { color: var(--text-3); }

    #index-btn {
      background: var(--blue); color: #16161e;
      border: none; border-radius: 5px;
      padding: 0 16px; min-height: 32px;
      font-family: var(--font-ui); font-size: 13px; font-weight: 600;
      cursor: pointer; transition: opacity .15s;
      flex-shrink: 0;
    }
    #index-btn:hover { opacity: .85; }
    #index-btn:disabled { opacity: .35; cursor: default; }

    #index-status {
      margin-top: 14px; width: 100%;
      display: flex; flex-direction: column; gap: 6px;
      font-family: var(--font-code); font-size: 12px; color: var(--text-2);
      min-height: 52px;
      opacity: 0; pointer-events: none;
      transition: opacity .2s;
    }
    #index-status.active { opacity: 1; pointer-events: auto; }
    #progress-label { display: flex; gap: 10px; align-items: baseline; }
    #progress-stage { color: var(--text-1); text-transform: capitalize; }
    #progress-detail {
      color: var(--text-3);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    #progress-track {
      height: 4px; background: var(--bg-active);
      border-radius: 3px; overflow: hidden;
      visibility: hidden;
    }
    #index-status.bar-active #progress-track { visibility: visible; }
    #progress-fill {
      height: 100%; width: 0%;
      background: var(--blue);
      transition: width .3s ease;
    }
    #progress-pct {
      color: var(--text-3); font-size: 11px;
      visibility: hidden;
    }
    #index-status.bar-active #progress-pct { visibility: visible; }

    /* ── Recent projects (no card) ── */
    #recent-section { width: 100%; }
    #recent-section h3 {
      font-size: 11px; font-weight: 600; text-transform: uppercase;
      letter-spacing: .08em; color: var(--text-2);
      margin-bottom: 8px; padding: 0 6px;
    }
    #recent-list { list-style: none; padding: 0; margin: 0; }
    #recent-list li { border-radius: 6px; display: flex; align-items: center; }
    #recent-list li:hover { background: var(--bg-hover); }
    #recent-list li:hover .del-btn { opacity: 1; }
    #recent-list a {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; padding: 7px 6px; flex: 1; min-width: 0;
      text-decoration: none; color: var(--text-1);
    }
    #recent-list .name { font-size: 13px; font-weight: 500; flex-shrink: 0; }
    #recent-list .rel { font-size: 12px; color: var(--text-3); flex-shrink: 0; }
    #recent-empty { font-size: 12px; color: var(--text-3); padding: 0 6px; }
    .del-btn {
      opacity: 0; flex-shrink: 0; margin-right: 4px;
      background: none; border: none; cursor: pointer;
      font-size: 11px; color: var(--text-3); padding: 4px 6px;
      border-radius: 4px; transition: color .15s, background .15s;
    }
    .del-btn:hover { color: #f7768e; background: rgba(247,118,142,.12); }

    #index-error {
      margin-top: 14px; width: 100%; padding: 10px 12px;
      font-size: 12.5px; font-family: var(--font-code);
      background: rgba(247,118,142,.08);
      color: var(--red);
      border: 1px solid rgba(247,118,142,.22);
      border-radius: 6px;
      text-align: left;
    }

    /* ── Main section / file tree ── */
    #main-section {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 16px;
      align-items: start;
    }

    #file-tree {
      background: var(--bg-raised);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      max-height: 70vh; overflow: auto;
      scrollbar-width: thin; scrollbar-color: var(--bg-hover) transparent;
    }
    #file-tree h3 {
      font-size: 11px; font-weight: 600; text-transform: uppercase;
      letter-spacing: .08em; color: var(--text-2);
      padding: 4px 4px 10px; margin: 0;
    }
    #file-tree ul {
      list-style: none; padding-left: 14px; margin: 0;
    }
    #file-tree > ul { padding-left: 0; }

    .file-node, .folder-node {
      cursor: pointer; user-select: none;
      padding: 3px 6px; border-radius: 4px;
      font-family: var(--font-code); font-size: 12px;
      color: var(--text-1); line-height: 1.7;
      transition: background .12s, color .12s;
    }
    .file-node { color: var(--text-2); }
    .file-node:hover { background: var(--bg-hover); color: var(--text-1); }

    .folder-node > .folder-label {
      display: inline-block;
      padding: 2px 6px; border-radius: 4px;
      font-weight: 500; color: var(--text-1);
      transition: background .12s;
    }
    .folder-label:hover { background: var(--bg-hover); }

    .file-node.selected,
    .folder-node.selected > .folder-label {
      background: rgba(122,162,247,.12);
      color: var(--blue);
    }

    .error {
      padding: 12px 14px;
      font-size: 13px; font-family: var(--font-code);
      background: rgba(247,118,142,.08);
      color: var(--red);
      border: 1px solid rgba(247,118,142,.22);
      border-radius: 8px;
    }

    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--bg-hover); border-radius: 3px; }

    @media (max-width: 720px) {
      #main-section { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<div id="topbar">
  <span class="logo"><img src="/logo.png" alt="AccliMate" class="logo-img" style="height:40px;vertical-align:middle;margin-right:6px">AccliMate</span>
  <span class="sep">/</span>
  <span class="repo">code indexer</span>
</div>

<div id="content">
<div id="app">
  <section id="index-section">
    <h1><img src="/logo.png" alt="" class="logo-img" style="height:64px;vertical-align:middle;margin-right:12px"><span class="hero-title-type">AccliMate</span></h1>
    <p class="subtitle">Paste a public GitHub repository URL to clone, chunk, and embed it.</p>

    <div id="repo-form">
      <input type="url" id="repo-url" placeholder="https://github.com/owner/repo"
             required pattern="https://(github|gitlab)\.com/.*">
      <button id="index-btn" onclick="startIndexing()">Index repo</button>
    </div>

    <div id="index-status">
      <div id="progress-label">
        <span id="progress-stage"></span>
        <span id="progress-detail"></span>
      </div>
      <div id="progress-track"><div id="progress-fill"></div></div>
      <div id="progress-pct">0%</div>
    </div>
    <div id="index-error" hidden></div>
  </section>

  <section id="recent-section">
    <h3>Recent projects</h3>
    <ul id="recent-list"></ul>
    <div id="recent-empty" hidden>No projects indexed yet.</div>
  </section>

  <section id="main-section" hidden>
    <!-- FE-02 (file tree) injects here. FE-03+ inject as backends land. -->
  </section>
</div>

</div><!-- #app -->
</div><!-- #content -->

<script src="app.js"></script>
</body>
</html>
