<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nemotron RAG — Workspace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-deep:    #16161e;
      --bg-main:    #1e1e2e;
      --bg-raised:  #24243a;
      --bg-hover:   #2d2d45;
      --bg-active:  #333350;
      --border:     rgba(255,255,255,0.07);
      --border-md:  rgba(255,255,255,0.12);
      --text-1: #e4e4f0;
      --text-2: #9898b8;
      --text-3: #55556a;
      --blue:   #7aa2f7;
      --purple: #bb9af7;
      --cyan:   #7dcfff;
      --green:  #9ece6a;
      --yellow: #e0af68;
      --red:    #f7768e;
      --font-ui:   'Inter', system-ui, sans-serif;
      --font-code: 'JetBrains Mono', 'Fira Code', Consolas, monospace;
    }

    html, body { height: 100%; overflow: hidden; background: var(--bg-main);
      color: var(--text-1); font-family: var(--font-ui); font-size: 14px; line-height: 1.5; }

    /* ── Top bar ── */
    #topbar {
      height: 40px; background: var(--bg-deep);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; padding: 0 16px; gap: 10px; flex-shrink: 0;
    }
    #topbar .logo { font-size: 13px; font-weight: 600; color: var(--purple); letter-spacing: .02em; }
    #topbar .sep  { color: var(--text-3); }
    #topbar .repo { font-family: var(--font-code); font-size: 12px; color: var(--text-2); }
    #topbar .badge {
      margin-left: auto; font-size: 11px; font-family: var(--font-code);
      padding: 2px 8px; border-radius: 4px;
      background: rgba(158,206,106,.12); color: var(--green);
      border: 1px solid rgba(158,206,106,.22);
    }
    #topbar .demo-pill {
      font-size: 11px; padding: 2px 8px; border-radius: 4px;
      background: rgba(224,175,104,.12); color: var(--yellow);
      border: 1px solid rgba(224,175,104,.22);
    }

    /* ── Shell ── */
    #app { display: flex; height: calc(100vh - 40px); overflow: hidden; }

    /* ── Panes ── */
    #left-pane {
      width: 38%; min-width: 260px; max-width: 58%;
      display: flex; flex-direction: column;
      background: var(--bg-raised); border-right: 1px solid var(--border);
      overflow: hidden; flex-shrink: 0;
    }
    #divider {
      width: 4px; cursor: col-resize; background: transparent; flex-shrink: 0;
      transition: background .15s;
    }
    #divider:hover, #divider.dragging { background: var(--blue); }
    #right-pane { flex: 1; min-width: 0; display: flex; flex-direction: column; overflow: hidden; }

    /* ── Chat header ── */
    #chat-header {
      padding: 10px 16px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 8px; flex-shrink: 0;
    }
    #chat-header h2 {
      font-size: 11px; font-weight: 600; text-transform: uppercase;
      letter-spacing: .08em; color: var(--text-2);
    }
    .scope-pill {
      margin-left: auto; font-family: var(--font-code); font-size: 11px;
      padding: 2px 9px; border-radius: 10px;
      background: rgba(122,162,247,.1); color: var(--blue);
      border: 1px solid rgba(122,162,247,.2); cursor: pointer;
    }
    .scope-pill:hover { background: rgba(122,162,247,.18); }

    /* ── Messages ── */
    #messages {
      flex: 1; overflow-y: auto; padding: 16px;
      display: flex; flex-direction: column; gap: 18px;
      scrollbar-width: thin; scrollbar-color: var(--bg-hover) transparent;
    }
    .msg { display: flex; flex-direction: column; gap: 4px; }
    .msg-label { font-size: 11px; color: var(--text-3); padding: 0 2px; }
    .msg-user .msg-label { align-self: flex-end; }

    .msg-user .bubble {
      align-self: flex-end; max-width: 88%;
      background: rgba(122,162,247,.1); border: 1px solid rgba(122,162,247,.2);
      border-radius: 12px 12px 2px 12px; padding: 10px 14px;
    }
    .msg-assistant .bubble {
      align-self: flex-start; max-width: 96%;
      background: var(--bg-active); border: 1px solid var(--border-md);
      border-radius: 2px 12px 12px 12px; padding: 12px 14px;
      font-size: 13.5px; line-height: 1.7;
    }
    .msg-assistant .bubble code {
      font-family: var(--font-code); font-size: 12px;
      background: rgba(255,255,255,.07); padding: 1px 5px; border-radius: 3px;
      color: var(--cyan);
    }

    .citations { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .cite-chip {
      font-family: var(--font-code); font-size: 11px;
      padding: 3px 9px; border-radius: 4px;
      background: rgba(125,207,255,.08); border: 1px solid rgba(125,207,255,.2);
      color: var(--cyan); cursor: pointer; white-space: nowrap;
      transition: background .12s, border-color .12s;
    }
    .cite-chip:hover { background: rgba(125,207,255,.18); border-color: rgba(125,207,255,.4); }

    .thinking {
      display: flex; gap: 4px; align-items: center;
      padding: 12px 14px; background: var(--bg-active);
      border: 1px solid var(--border-md); border-radius: 2px 12px 12px 12px;
      align-self: flex-start;
    }
    .thinking span {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--text-3); animation: blink 1.2s infinite;
    }
    .thinking span:nth-child(2) { animation-delay: .2s; }
    .thinking span:nth-child(3) { animation-delay: .4s; }
    @keyframes blink { 0%,60%,100% { opacity: .25; } 30% { opacity: 1; } }

    /* ── Input ── */
    #input-area {
      border-top: 1px solid var(--border);
      padding: 12px 16px; display: flex; flex-direction: column; gap: 6px; flex-shrink: 0;
    }
    #input-wrap {
      display: flex; align-items: flex-end; gap: 8px;
      background: var(--bg-active); border: 1px solid var(--border-md);
      border-radius: 8px; padding: 8px 10px; transition: border-color .15s;
    }
    #input-wrap:focus-within { border-color: rgba(122,162,247,.4); }
    #chat-input {
      flex: 1; background: none; border: none; outline: none;
      color: var(--text-1); font-family: var(--font-ui); font-size: 14px;
      resize: none; max-height: 120px; scrollbar-width: thin;
    }
    #chat-input::placeholder { color: var(--text-3); }
    #send-btn {
      background: var(--blue); color: #16161e; border: none; border-radius: 5px;
      width: 30px; height: 30px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px; flex-shrink: 0; transition: opacity .15s;
    }
    #send-btn:hover { opacity: .82; }
    #send-btn:disabled { opacity: .35; cursor: default; }
    #input-hint { font-size: 11px; color: var(--text-3); }

    /* ── Canvas tabs ── */
    #canvas-tabs {
      display: flex; align-items: center;
      background: var(--bg-deep); border-bottom: 1px solid var(--border);
      padding: 0 4px; height: 38px; gap: 2px; flex-shrink: 0;
    }
    .tab-btn {
      background: none; border: none; color: var(--text-3);
      font-family: var(--font-ui); font-size: 12px; font-weight: 500;
      padding: 5px 12px; cursor: pointer; border-radius: 4px;
      transition: color .12s, background .12s;
      display: flex; align-items: center; gap: 6px;
    }
    .tab-btn:hover { color: var(--text-1); background: var(--bg-hover); }
    .tab-btn.active { color: var(--blue); background: rgba(122,162,247,.1); }

    .canvas-panel { display: none; flex: 1; overflow: hidden; }
    .canvas-panel.active { display: flex; flex-direction: column; }

    /* ── Welcome ── */
    #welcome-state {
      flex: 1; display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 14px; color: var(--text-3);
    }
    #welcome-state .icon { font-size: 42px; opacity: .25; }
    #welcome-state p { font-size: 13px; text-align: center; max-width: 260px; line-height: 1.6; }

    /* ── Code viewer ── */
    #code-viewer { flex: 1; overflow: hidden; display: flex; flex-direction: column; }
    #code-header {
      background: var(--bg-deep); border-bottom: 1px solid var(--border);
      padding: 7px 16px; display: flex; align-items: center; gap: 10px; flex-shrink: 0;
    }
    #code-file-path { font-family: var(--font-code); font-size: 12px; color: var(--text-2); }
    #code-file-path .fname { color: var(--cyan); }
    #code-lang-badge {
      margin-left: auto; font-family: var(--font-code); font-size: 10px;
      padding: 2px 6px; border-radius: 3px;
      background: rgba(122,162,247,.1); color: var(--blue);
      border: 1px solid rgba(122,162,247,.2);
    }
    #code-scroll {
      flex: 1; overflow: auto;
      scrollbar-width: thin; scrollbar-color: var(--bg-hover) transparent;
    }
    #code-lines { padding: 12px 0; }
    .code-line { display: flex; min-width: max-content; }
    .line-num {
      width: 52px; flex-shrink: 0; text-align: right; padding-right: 16px;
      color: var(--text-3); font-family: var(--font-code); font-size: 12px;
      user-select: none; line-height: 1.72;
    }
    .line-content {
      flex: 1; padding-right: 32px;
      font-family: var(--font-code); font-size: 12.5px; line-height: 1.72;
    }
    .line-hl {
      background: rgba(224,175,104,.1);
      border-left: 2px solid var(--yellow);
    }
    .line-hl .line-num { color: var(--yellow); padding-left: 2px; }

    /* Prism overrides */
    code[class*="language-"], pre[class*="language-"] {
      background: transparent !important; font-family: var(--font-code) !important;
      font-size: 12.5px !important; line-height: 1.72 !important;
      text-shadow: none !important;
    }

    /* ── Architecture ── */
    #arch-panel { flex: 1; overflow: hidden; position: relative; }
    #arch-toolbar {
      position: absolute; top: 12px; right: 12px;
      display: flex; gap: 6px; z-index: 5;
    }
    .arch-btn {
      background: var(--bg-raised); border: 1px solid var(--border-md);
      color: var(--text-2); font-size: 11px; font-family: var(--font-ui);
      padding: 4px 10px; border-radius: 4px; cursor: pointer; transition: background .12s;
    }
    .arch-btn:hover { background: var(--bg-hover); color: var(--text-1); }
    #arch-svg { width: 100%; height: 100%; }

    /* ── Trace ── */
    #trace-inner {
      flex: 1; overflow-y: auto; padding: 20px;
      scrollbar-width: thin; scrollbar-color: var(--bg-hover) transparent;
    }
    .trace-title {
      font-size: 11px; font-weight: 600; text-transform: uppercase;
      letter-spacing: .08em; color: var(--text-2); margin-bottom: 8px;
    }
    .trace-source {
      font-family: var(--font-code); font-size: 12.5px; color: var(--cyan);
      padding: 6px 12px; background: rgba(125,207,255,.07);
      border-radius: 5px; border-left: 3px solid var(--cyan);
      margin-bottom: 16px;
    }
    .trace-count { font-size: 12px; color: var(--text-2); margin-bottom: 12px; }
    .trace-list { display: flex; flex-direction: column; gap: 6px; }
    .trace-item {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 12px; background: var(--bg-raised);
      border: 1px solid var(--border); border-radius: 6px;
      cursor: pointer; transition: border-color .12s, background .12s;
    }
    .trace-item:hover { border-color: var(--border-md); background: var(--bg-hover); }
    .trace-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .trace-dot.direct    { background: var(--red); }
    .trace-dot.transitive { background: var(--yellow); }
    .trace-path { font-family: var(--font-code); font-size: 12px; color: var(--text-1); }
    .trace-badge {
      margin-left: auto; font-size: 10px; padding: 2px 7px; border-radius: 3px;
    }
    .trace-badge.direct    { background: rgba(247,118,142,.12); color: var(--red);    border: 1px solid rgba(247,118,142,.22); }
    .trace-badge.transitive { background: rgba(224,175,104,.12); color: var(--yellow); border: 1px solid rgba(224,175,104,.22); }

    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--bg-hover); border-radius: 3px; }
  </style>
</head>
<body>

<div id="topbar">
  <span class="logo">⬡ Nemotron RAG</span>
  <span class="sep">/</span>
  <span class="repo">pallets / flask</span>
  <span class="demo-pill">demo data</span>
  <span class="badge">● 83 files indexed</span>
</div>

<div id="app">

  <!-- LEFT: Chat -->
  <div id="left-pane">
    <div id="chat-header">
      <h2>Assistant</h2>
      <span class="scope-pill" id="scope-label">⊙ Whole codebase</span>
    </div>
    <div id="messages"></div>
    <div id="input-area">
      <div id="input-wrap">
        <textarea id="chat-input" rows="1" placeholder="Ask anything about this codebase…"></textarea>
        <button id="send-btn" title="Send (Enter)">↑</button>
      </div>
      <span id="input-hint">Enter to send · Shift+Enter for newline</span>
    </div>
  </div>

  <div id="divider"></div>

  <!-- RIGHT: Canvas -->
  <div id="right-pane">
    <div id="canvas-tabs">
      <button class="tab-btn active" data-tab="code">◧ Code</button>
      <button class="tab-btn" data-tab="arch">⬡ Architecture</button>
      <button class="tab-btn" data-tab="trace">⇢ Trace</button>
    </div>

    <!-- Code panel -->
    <div class="canvas-panel active" id="panel-code">
      <div id="code-viewer">
        <div id="welcome-state">
          <div class="icon">◧</div>
          <p>Click a citation chip in the chat to open a file here.</p>
        </div>
        <div id="code-content" style="display:none;flex:1;flex-direction:column;overflow:hidden;">
          <div id="code-header">
            <span id="code-file-path"></span>
            <span id="code-lang-badge"></span>
          </div>
          <div id="code-scroll"><div id="code-lines"></div></div>
        </div>
      </div>
    </div>

    <!-- Architecture panel -->
    <div class="canvas-panel" id="panel-arch">
      <div id="arch-panel">
        <div id="arch-toolbar">
          <button class="arch-btn" id="btn-expand">Expand all</button>
          <button class="arch-btn" id="btn-collapse">Collapse all</button>
          <button class="arch-btn" id="btn-reset">Reset zoom</button>
        </div>
        <svg id="arch-svg"></svg>
      </div>
    </div>

    <!-- Trace panel -->
    <div class="canvas-panel" id="panel-trace">
      <div id="trace-inner">
        <div class="trace-title">Dependency Trace</div>
        <div class="trace-source">src/flask/__init__.py</div>
        <div class="trace-count">5 file(s) import this module directly or transitively</div>
        <div class="trace-list" id="trace-list"></div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>

const RESPONSES = [
  {
    q: "How does routing work in Flask?",
    a: `Flask routing is built on Werkzeug's URL routing engine. When you call <code>@app.route('/path')</code>, it invokes <code>add_url_rule</code>, which creates a <code>Rule</code> object and registers it on the app's <code>url_map</code>.\n\nAt request time, <code>wsgi_app</code> pushes a request context and calls <code>full_dispatch_request</code>. The bound <code>MapAdapter</code> matches the incoming URL against all registered rules and dispatches to the correct view function.`,
    citations: [{ path: "src/flask/app.py", line: 56 }, { path: "src/flask/app.py", line: 64 }, { path: "src/flask/routing.py", line: 22 }]
  },
  {
    q: "What does __init__.py export?",
    a: `<code>src/flask/__init__.py</code> is the public API surface — it re-exports every symbol you can import directly from <code>flask</code>.\n\nThis includes the <code>Flask</code> app class, <code>Blueprint</code>, request globals (<code>request</code>, <code>g</code>, <code>session</code>), helpers like <code>url_for</code>, <code>redirect</code>, <code>flash</code>, and response utilities like <code>jsonify</code> and <code>make_response</code>.`,

// ── Utilities ──────────────────────────────────────────────────────────────────

function esc(s) {
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

// ── Tab control ────────────────────────────────────────────────────────────────

let activeTab = "code";

function switchTab(name) {
  document.querySelectorAll(".tab-btn").forEach(b => b.classList.toggle("active", b.dataset.tab === name));
  document.querySelectorAll(".canvas-panel").forEach(p => p.classList.remove("active"));
  document.getElementById(`panel-${name}`).classList.add("active");
  activeTab = name;
  if (name === "arch") initArch();
}

document.querySelectorAll(".tab-btn").forEach(b => b.addEventListener("click", () => switchTab(b.dataset.tab)));

// ── Code viewer ────────────────────────────────────────────────────────────────

function openCodeViewer(filePath, targetLine) {
  switchTab("code");
  const file = FILES[filePath];

  document.getElementById("welcome-state").style.display = file ? "none" : "";
  const content = document.getElementById("code-content");
  content.style.display = file ? "flex" : "none";
  if (!file) return;

  const parts = filePath.split("/");
  const fname = parts.pop();
  document.getElementById("code-file-path").innerHTML =
    parts.map(p => `<span style="color:var(--text-3)">${esc(p)}/</span>`).join("") +
    `<span class="fname">${esc(fname)}</span>`;
  document.getElementById("code-lang-badge").textContent = file.language;

  const linesEl = document.getElementById("code-lines");
  linesEl.innerHTML = "";

  const grammar = Prism.languages[file.language] || Prism.languages.clike;
  file.content.split("\n").forEach((raw, i) => {
    const n = i + 1;
    const hl = targetLine && n === targetLine;
    const row = document.createElement("div");
    row.className = "code-line" + (hl ? " line-hl" : "");
    row.dataset.line = n;
    row.innerHTML =
      `<span class="line-num">${n}</span>` +
      `<span class="line-content language-${file.language}">${Prism.highlight(raw, grammar, file.language) || " "}</span>`;
    linesEl.appendChild(row);
  });

  if (targetLine) {
    requestAnimationFrame(() => {
      const scroll = document.getElementById("code-scroll");
      const hlRow = linesEl.querySelector(`[data-line="${targetLine}"]`);
      if (hlRow) scroll.scrollTop = Math.max(0, hlRow.offsetTop - scroll.clientHeight / 2.5);
    });
  }
}

// ── Chat ───────────────────────────────────────────────────────────────────────

const messagesEl = document.getElementById("messages");
const inputEl    = document.getElementById("chat-input");
const sendBtn    = document.getElementById("send-btn");
let responseIdx  = 0;

function appendMsg(role, html, citations) {
  const wrap = document.createElement("div");
  wrap.className = `msg msg-${role}`;

  const label = document.createElement("span");
  label.className = "msg-label";
  label.textContent = role === "user" ? "You" : "Nemotron";
  wrap.appendChild(label);

  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.innerHTML = html;

  if (citations && citations.length) {
    const chips = document.createElement("div");
    chips.className = "citations";
    citations.forEach(c => {
      const chip = document.createElement("span");
      chip.className = "cite-chip";
      chip.textContent = `${c.path}:${c.line}`;
      chip.addEventListener("click", () => openCodeViewer(c.path, c.line));
      chips.appendChild(chip);
    });
    bubble.appendChild(chips);
  }

  wrap.appendChild(bubble);
  messagesEl.appendChild(wrap);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function showThinking() {
  const wrap = document.createElement("div");
  wrap.className = "msg msg-assistant";
  wrap.id = "_thinking";
  const b = document.createElement("div");
  b.className = "thinking";
  b.innerHTML = "<span></span><span></span><span></span>";
  wrap.appendChild(b);
  messagesEl.appendChild(wrap);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}
function removeThinking() { document.getElementById("_thinking")?.remove(); }

function sendMessage() {
  const text = inputEl.value.trim();
  if (!text) return;
  inputEl.value = "";
  inputEl.style.height = "auto";
  sendBtn.disabled = true;

  appendMsg("user", esc(text));
  showThinking();

  const r = RESPONSES[responseIdx % RESPONSES.length];
  responseIdx++;
  setTimeout(() => {
    removeThinking();
    appendMsg("assistant", r.a, r.citations);
    sendBtn.disabled = false;
  }, 800 + Math.random() * 700);
}

sendBtn.addEventListener("click", sendMessage);
inputEl.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); } });
inputEl.addEventListener("input", () => { inputEl.style.height = "auto"; inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + "px"; });

// Seed initial conversation
appendMsg("assistant", `I've indexed <strong>83 files</strong> from <code>pallets/flask</code>. Ask me how routing works, what a module exports, or switch to <em>Architecture</em> to explore the file tree.`, []);
appendMsg("user", esc(RESPONSES[0].q));
showThinking();
setTimeout(() => { removeThinking(); appendMsg("assistant", RESPONSES[0].a, RESPONSES[0].citations); responseIdx = 1; }, 1400);

// ── Trace panel ────────────────────────────────────────────────────────────────

TRACE_DATA.forEach(item => {
  const el = document.createElement("div");
  el.className = "trace-item";
  el.innerHTML = `<span class="trace-dot ${item.type}"></span>
    <span class="trace-path">${esc(item.path)}</span>
    <span class="trace-badge ${item.type}">${item.type}</span>`;
  el.addEventListener("click", () => openCodeViewer(item.path, 1));
  document.getElementById("trace-list").appendChild(el);
});

// ── Architecture D3 ────────────────────────────────────────────────────────────

let archInited = false;

function initArch() {
  if (archInited) return;
  archInited = true;

  const container = document.getElementById("arch-panel");
  const W = container.clientWidth, H = container.clientHeight;
  const svg = d3.select("#arch-svg");
  const g = svg.append("g");

  const zoom = d3.zoom().scaleExtent([0.15, 4]).on("zoom", e => g.attr("transform", e.transform));
  svg.call(zoom);

  const resetView = () => svg.transition().duration(350)
    .call(zoom.transform, d3.zoomIdentity.translate(W * 0.1, H / 2).scale(0.88));

  document.getElementById("btn-reset").addEventListener("click", resetView);

  const root = d3.hierarchy(ARCH_TREE);
  root.x0 = H / 2; root.y0 = 0;

  root.descendants().forEach(d => {
    if (d.depth >= 2 && d.children) { d._children = d.children; d.children = null; }
  });

  const tree = d3.tree().nodeSize([20, 190]);

  const LANG_COLOR = { python:"#4B8BBE", javascript:"#F7DF1E", typescript:"#3178C6",
    tsx:"#3178C6", go:"#00ADD8", rust:"#CE422B", java:"#ED8B00", cpp:"#659AD2", unknown:"#6B7280" };

  function update(src) {
    tree(root);
    const nodes = root.descendants(), links = root.links();

    const link = g.selectAll(".al").data(links, d => d.target.data.id);
    link.enter().append("path").attr("class","al")
      .attr("fill","none").attr("stroke","rgba(255,255,255,0.08)").attr("stroke-width",1)
      .merge(link).transition().duration(220)
      .attr("d", d3.linkHorizontal().x(d => d.y).y(d => d.x));
    link.exit().remove();

    const node = g.selectAll(".an").data(nodes, d => d.data.id);
    const enter = node.enter().append("g").attr("class","an")
      .attr("transform", `translate(${src.y0},${src.x0})`).style("cursor","pointer")
      .on("click", (_, d) => {
        if (d.data.type === "file") { openCodeViewer(d.data.id, 1); return; }
        if (d.children) { d._children = d.children; d.children = null; }
        else { d.children = d._children; d._children = null; }
        update(d);
      });

    enter.append("circle").attr("r", 5)
      .attr("stroke","rgba(255,255,255,0.12)").attr("stroke-width",1);
    enter.append("text").attr("dy","0.32em")
      .attr("font-family","var(--font-code)").attr("font-size","11px")
      .attr("fill","var(--text-2)");

    const merged = enter.merge(node);
    merged.transition().duration(220).attr("transform", d => `translate(${d.y},${d.x})`);
    merged.select("circle").attr("fill", d =>
      d.data.type === "folder" ? (d.children ? "#6B7280" : "#374151") : (LANG_COLOR[d.data.language] || LANG_COLOR.unknown)
    );
    merged.select("text")
      .attr("x", d => (d.children || d._children) ? -9 : 9)
      .attr("text-anchor", d => (d.children || d._children) ? "end" : "start")
      .text(d => d.data.name);

    node.exit().transition().duration(220).attr("transform", `translate(${src.y},${src.x})`).remove();
    nodes.forEach(d => { d.x0 = d.x; d.y0 = d.y; });
  }

  update(root);
  resetView();

  document.getElementById("btn-expand").addEventListener("click", () => {
    root.descendants().forEach(d => { if (d._children) { d.children = d._children; d._children = null; } });
    update(root);
  });
  document.getElementById("btn-collapse").addEventListener("click", () => {
    root.descendants().forEach(d => { if (d.depth > 0 && d.children) { d._children = d.children; d.children = null; } });
    update(root);
  });
}

// ── Resizable divider ──────────────────────────────────────────────────────────

const divider  = document.getElementById("divider");
const leftPane = document.getElementById("left-pane");
let dragging   = false;

divider.addEventListener("mousedown", () => {
  dragging = true; divider.classList.add("dragging");
  document.body.style.cssText += ";cursor:col-resize;user-select:none";
});
document.addEventListener("mousemove", e => {
  if (!dragging) return;
  const rect = document.getElementById("app").getBoundingClientRect();
  leftPane.style.width = Math.max(260, Math.min(e.clientX - rect.left, rect.width * 0.65)) + "px";
});
document.addEventListener("mouseup", () => {
  if (!dragging) return;
  dragging = false; divider.classList.remove("dragging");
  document.body.style.cursor = ""; document.body.style.userSelect = "";
  if (activeTab === "arch") { archInited = false; document.getElementById("arch-svg").innerHTML = ""; initArch(); }
});
</script>
