<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AccliMate — Workspace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-deep:   #16161e;
      --bg-main:   #1e1e2e;
      --bg-raised: #24243a;
      --bg-hover:  #2d2d45;
      --bg-active: #333350;
      --border:    rgba(255,255,255,0.07);
      --border-md: rgba(255,255,255,0.12);
      --text-1: #e4e4f0;
      --text-2: #9898b8;
      --text-3: #55556a;
      --blue:   #7aa2f7;
      --purple: #bb9af7;
      --cyan:   #7dcfff;
      --green:  #9ece6a;
      --yellow: #e0af68;
      --red:    #f7768e;
      --font-ui:   'Inter', system-ui, sans-serif;
      --font-code: 'JetBrains Mono', 'Fira Code', Consolas, monospace;
    }

    html, body {
      height: 100%; overflow: hidden;
      background: var(--bg-main); color: var(--text-1);
      font-family: var(--font-ui); font-size: 14px; line-height: 1.5;
    }

    /* ── Top bar ── */
    #topbar {
      height: 40px; background: var(--bg-deep);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; padding: 0 16px; gap: 10px; flex-shrink: 0;
    }
    .logo {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 13px; font-weight: 600; color: var(--purple); letter-spacing: .02em;
    }
    .logo-img { mix-blend-mode: normal; }
    .logo-link {
      text-decoration: none;
      color: inherit;
      border-radius: 4px;
    }
    .logo-link:hover { opacity: 0.92; }
    .logo-link:focus-visible {
      outline: 2px solid var(--blue);
      outline-offset: 2px;
    }
    .repo { font-family: var(--font-code); font-size: 12px; color: var(--text-2); }
    .sep  { color: var(--text-3); }
    .demo-pill {
      font-size: 11px; padding: 2px 8px; border-radius: 4px;
      background: rgba(224,175,104,.12); color: var(--yellow);
      border: 1px solid rgba(224,175,104,.22);
    }
    .indexed-badge {
      margin-left: auto; font-size: 11px; font-family: var(--font-code);
      padding: 2px 8px; border-radius: 4px;
      background: rgba(158,206,106,.12); color: var(--green);
      border: 1px solid rgba(158,206,106,.22);
    }

    /* ── Shell ── */
    #app { display: flex; height: calc(100vh - 40px); overflow: hidden; }

    /* ── Left pane — chat ── */
    #left-pane {
      width: 38%; min-width: 260px; max-width: 58%; flex-shrink: 0;
      display: flex; flex-direction: column;
      background: var(--bg-raised); border-right: 1px solid var(--border); overflow: hidden;
    }
    #chat-header {
      padding: 10px 16px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 8px; flex-shrink: 0;
    }
    #chat-header h2 {
      font-size: 11px; font-weight: 600; text-transform: uppercase;
      letter-spacing: .08em; color: var(--text-2);
    }
    .scope-pill {
      margin-left: auto; font-family: var(--font-code); font-size: 11px;
      padding: 2px 9px; border-radius: 10px;
      background: rgba(122,162,247,.1); color: var(--blue);
      border: 1px solid rgba(122,162,247,.2); cursor: pointer;
    }
    .scope-pill:hover { background: rgba(122,162,247,.18); }

    #messages {
      flex: 1; overflow-y: auto; padding: 16px;
      display: flex; flex-direction: column; gap: 18px;
      scrollbar-width: thin; scrollbar-color: var(--bg-hover) transparent;
    }
    .msg { display: flex; flex-direction: column; gap: 4px; }
    .msg-label { font-size: 11px; color: var(--text-3); padding: 0 2px; }
    .msg-user .msg-label { align-self: flex-end; }

    .msg-user .bubble {
      align-self: flex-end; max-width: 88%;
      background: rgba(122,162,247,.1); border: 1px solid rgba(122,162,247,.2);
      border-radius: 12px 12px 2px 12px; padding: 10px 14px;
    }
    .msg-assistant .bubble {
      align-self: flex-start; max-width: 96%;
      background: var(--bg-active); border: 1px solid var(--border-md);
      border-radius: 2px 12px 12px 12px; padding: 12px 14px;
      font-size: 13.5px; line-height: 1.7;
    }
    .msg-assistant .bubble code {
      font-family: var(--font-code); font-size: 12px;
      background: rgba(255,255,255,.07); padding: 1px 5px; border-radius: 3px; color: var(--cyan);
    }

    .citations { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .cite-chip {
      font-family: var(--font-code); font-size: 11px; padding: 3px 9px; border-radius: 4px;
      background: rgba(125,207,255,.08); border: 1px solid rgba(125,207,255,.2);
      color: var(--cyan); cursor: pointer; white-space: nowrap; transition: background .12s, border-color .12s;
    }
    .cite-chip:hover { background: rgba(125,207,255,.18); border-color: rgba(125,207,255,.4); }

    .trace-chip {
      display: inline-flex; align-items: center; gap: 6px;
      font-family: var(--font-code); font-size: 11px; padding: 3px 9px; border-radius: 4px;
      background: rgba(247,118,142,.08); border: 1px solid rgba(247,118,142,.2);
      color: var(--red); cursor: pointer; white-space: nowrap; margin-top: 10px;
      transition: background .12s, border-color .12s;
    }
    .trace-chip:hover { background: rgba(247,118,142,.18); border-color: rgba(247,118,142,.4); }

    .thinking {
      display: flex; gap: 4px; align-items: center; padding: 12px 14px;
      background: var(--bg-active); border: 1px solid var(--border-md);
      border-radius: 2px 12px 12px 12px; align-self: flex-start;
    }
    .thinking span {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--text-3); animation: blink 1.2s infinite;
    }
    .thinking span:nth-child(2) { animation-delay: .2s; }
    .thinking span:nth-child(3) { animation-delay: .4s; }
    @keyframes blink { 0%,60%,100% { opacity:.25; } 30% { opacity:1; } }

    #input-area {
      border-top: 1px solid var(--border); padding: 12px 16px;
      display: flex; flex-direction: column; gap: 6px; flex-shrink: 0;
    }
    #input-wrap {
      display: flex; align-items: flex-end; gap: 8px;
      background: var(--bg-active); border: 1px solid var(--border-md);
      border-radius: 8px; padding: 12px 14px; transition: border-color .15s;
      min-height: 70px; cursor: text;
    }
    #input-wrap:focus-within { border-color: rgba(122,162,247,.4); }
    #chat-input {
      flex: 1; background: none; border: none; outline: none;
      color: var(--text-1); font-family: var(--font-ui); font-size: 14px;
      resize: none; max-height: 200px; scrollbar-width: thin;
      align-self: stretch;
    }
    #chat-input::placeholder { color: var(--text-3); }
    #send-btn {
      background: var(--blue); color: #16161e; border: none; border-radius: 5px;
      width: 30px; height: 30px; cursor: pointer; display: flex; align-items: center;
      justify-content: center; font-size: 15px; flex-shrink: 0; transition: opacity .15s;
    }
    #send-btn:hover { opacity: .82; }
    #send-btn:disabled { opacity: .35; cursor: default; }
    #input-hint { font-size: 11px; color: var(--text-3); }

    /* ── Divider ── */
    #divider {
      width: 4px; cursor: col-resize; background: transparent; flex-shrink: 0; transition: background .15s;
    }
    #divider:hover, #divider.dragging { background: var(--blue); }

    /* ── Right pane — canvas ── */
    #right-pane { flex: 1; min-width: 0; display: flex; flex-direction: column; overflow: hidden; position: relative; }

    /* Canvas tab bar */
    #ctx-bar {
      height: 36px; background: var(--bg-deep); border-bottom: 1px solid var(--border);
      display: flex; align-items: stretch; padding: 0 4px; gap: 2px; flex-shrink: 0;
      overflow-x: auto; overflow-y: hidden; scrollbar-width: thin; scrollbar-color: var(--bg-hover) transparent;
    }
    .ctx-tab {
      display: flex; align-items: center; gap: 6px;
      padding: 0 12px; border: none; background: none; cursor: pointer;
      font-family: var(--font-ui); font-size: 12px; font-weight: 500;
      color: var(--text-3); border-radius: 4px; margin: 4px 0;
      transition: color .12s, background .12s; white-space: nowrap;
    }
    .ctx-tab:hover { color: var(--text-1); background: var(--bg-hover); }
    .ctx-tab.active { color: var(--blue); background: rgba(122,162,247,.1); }
    .ctx-tab .tab-close {
      font-size: 13px; color: var(--text-3); line-height: 1;
      padding: 0 0 0 2px; transition: color .12s;
    }
    .ctx-tab .tab-close:hover { color: var(--red); }

    /* Canvas layers — all stacked, only one visible */
    .canvas-layer {
      position: absolute; inset: 36px 0 0 0;
      display: flex; flex-direction: column; overflow: hidden;
      opacity: 0; pointer-events: none;
      transition: opacity .18s ease, transform .18s ease;
      transform: translateY(6px);
    }
    .canvas-layer.active {
      opacity: 1; pointer-events: all; transform: translateY(0);
    }

    /* ── Architecture ── */
    #layer-arch { background: var(--bg-main); }
    #arch-toolbar {
      position: absolute; top: 10px; right: 12px;
      display: flex; gap: 6px; z-index: 5;
    }
    .arch-btn {
      background: var(--bg-raised); border: 1px solid var(--border-md);
      color: var(--text-2); font-size: 11px; font-family: var(--font-ui);
      padding: 4px 10px; border-radius: 4px; cursor: pointer; transition: background .12s;
    }
    .arch-btn:hover { background: var(--bg-hover); color: var(--text-1); }
    .arch-input {
      background: var(--bg-raised); border: 1px solid var(--border-md);
      color: var(--text-1); font-size: 11px; font-family: var(--font-ui);
      padding: 4px 8px; border-radius: 4px; outline: none; width: 140px;
      transition: border-color .12s;
    }
    .arch-input:focus { border-color: var(--blue); }
    .arch-input::placeholder { color: var(--text-3); }
    #arch-svg { width: 100%; height: 100%; display: block; }

    /* ── Code viewer ── */
    #layer-code { background: var(--bg-main); }
    #code-header {
      background: var(--bg-deep); border-bottom: 1px solid var(--border);
      padding: 7px 16px; display: flex; align-items: center; gap: 10px; flex-shrink: 0;
    }
    #code-file-path { font-family: var(--font-code); font-size: 12px; color: var(--text-2); }
    #code-file-path .fname { color: var(--cyan); }
    #code-lang-badge {
      margin-left: auto; font-family: var(--font-code); font-size: 10px;
      padding: 2px 6px; border-radius: 3px;
      background: rgba(122,162,247,.1); color: var(--blue); border: 1px solid rgba(122,162,247,.2);
    }
    #code-scroll {
      flex: 1; overflow: auto;
      scrollbar-width: thin; scrollbar-color: var(--bg-hover) transparent;
    }
    #code-lines { padding: 12px 0; }
    .code-line { display: flex; min-width: max-content; }
    .line-num {
      width: 52px; flex-shrink: 0; text-align: right; padding-right: 16px;
      color: var(--text-3); font-family: var(--font-code); font-size: 12px;
      user-select: none; line-height: 1.72;
    }
    .line-content {
      flex: 1; padding-right: 32px;
      font-family: var(--font-code); font-size: 12.5px; line-height: 1.72;
      white-space: pre;
    }
    .line-hl { background: rgba(224,175,104,.1); border-left: 2px solid var(--yellow); }
    .line-hl .line-num { color: var(--yellow); }

    code[class*="language-"], pre[class*="language-"] {
      background: transparent !important; font-family: var(--font-code) !important;
      font-size: 12.5px !important; line-height: 1.72 !important; text-shadow: none !important;
    }

    /* ── Trace view ── */
    #layer-trace { background: var(--bg-main); }
    #trace-inner {
      flex: 1; overflow-y: auto; padding: 24px;
      scrollbar-width: thin; scrollbar-color: var(--bg-hover) transparent;
    }
    .trace-section-title {
      font-size: 11px; font-weight: 600; text-transform: uppercase;
      letter-spacing: .08em; color: var(--text-2); margin-bottom: 10px;
    }
    .trace-source-box {
      font-family: var(--font-code); font-size: 13px; color: var(--cyan);
      padding: 8px 14px; background: rgba(125,207,255,.07);
      border-radius: 6px; border-left: 3px solid var(--cyan); margin-bottom: 20px;
    }
    .trace-count { font-size: 12px; color: var(--text-2); margin-bottom: 14px; }
    .trace-list { display: flex; flex-direction: column; gap: 7px; }
    .trace-item {
      display: flex; align-items: center; gap: 10px; padding: 10px 14px;
      background: var(--bg-raised); border: 1px solid var(--border); border-radius: 7px;
      cursor: pointer; transition: border-color .12s, background .12s;
    }
    .trace-item:hover { border-color: var(--border-md); background: var(--bg-hover); }
    .trace-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .trace-dot.direct     { background: var(--red); }
    .trace-dot.transitive { background: var(--yellow); }
    .trace-path { font-family: var(--font-code); font-size: 12px; color: var(--text-1); }
    .trace-badge {
      margin-left: auto; font-size: 10px; padding: 2px 7px; border-radius: 3px;
    }
    .trace-badge.direct     { background: rgba(247,118,142,.12); color: var(--red);    border: 1px solid rgba(247,118,142,.22); }
    .trace-badge.transitive { background: rgba(224,175,104,.12); color: var(--yellow); border: 1px solid rgba(224,175,104,.22); }

    /* ── Chat mode toggle ── */
    #mode-toggle {
      margin-left: auto; display: inline-flex; gap: 2px;
      background: var(--bg-active); border: 1px solid var(--border-md);
      border-radius: 6px; padding: 2px;
    }
    .mode-btn {
      font-family: var(--font-ui); font-size: 11px; font-weight: 500;
      color: var(--text-2); background: none; border: none; border-radius: 4px;
      padding: 4px 10px; cursor: pointer; transition: background .12s, color .12s;
    }
    .mode-btn:hover { color: var(--text-1); }
    .mode-btn.active {
      background: rgba(122,162,247,.15); color: var(--blue);
    }

    /* ── Narrative player (inside assistant bubble) ── */
    .narrative-player { display: flex; flex-direction: column; gap: 10px; }
    .narrative-step {
      font-size: 13.5px; line-height: 1.7;
    }
    .narrative-controls {
      display: flex; align-items: center; gap: 10px;
      padding-top: 8px; border-top: 1px solid var(--border);
    }
    .narrative-nav-btn {
      font-family: var(--font-ui); font-size: 11px; font-weight: 500;
      background: var(--bg-raised); color: var(--text-1);
      border: 1px solid var(--border-md); border-radius: 4px;
      padding: 4px 12px; cursor: pointer; transition: background .12s;
    }
    .narrative-nav-btn:hover:not(:disabled) { background: var(--bg-hover); }
    .narrative-nav-btn:disabled { opacity: .35; cursor: default; }
    .narrative-replay-btn,
    .narrative-stop-btn {
      display: inline-flex; align-items: center; gap: 5px;
    }
    .narrative-replay-btn {
      color: var(--cyan);
      border-color: rgba(125, 207, 255, 0.35);
      background: rgba(125, 207, 255, 0.06);
    }
    .narrative-replay-btn:hover:not(:disabled) {
      background: rgba(125, 207, 255, 0.14);
      border-color: rgba(125, 207, 255, 0.55);
    }
    .narrative-stop-btn {
      color: var(--red);
      border-color: rgba(247, 118, 142, 0.35);
      background: rgba(247, 118, 142, 0.06);
    }
    .narrative-stop-btn:hover:not(:disabled) {
      background: rgba(247, 118, 142, 0.14);
      border-color: rgba(247, 118, 142, 0.55);
    }
    .narrative-step-counter {
      margin-left: auto; font-family: var(--font-code); font-size: 11px;
      color: var(--text-2);
    }

    /* ── Narrative zoom (per-component deep dive) ── */
    .narrative-zoom-row {
      display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
      padding-top: 2px;
    }
    .narrative-zoom-btn {
      font-family: var(--font-ui); font-size: 11.5px; font-weight: 500;
      background: rgba(125, 207, 255, 0.08); color: var(--cyan);
      border: 1px solid rgba(125, 207, 255, 0.35); border-radius: 4px;
      padding: 5px 12px; cursor: pointer;
      display: inline-flex; align-items: center; gap: 6px;
      transition: background .12s, border-color .12s, transform .08s;
    }
    .narrative-zoom-btn:hover:not(:disabled) {
      background: rgba(125, 207, 255, 0.15); border-color: rgba(125, 207, 255, 0.6);
    }
    .narrative-zoom-btn:active:not(:disabled) { transform: translateY(1px); }
    .narrative-zoom-btn:disabled { opacity: .45; cursor: default; }
    .narrative-zoom-btn.is-zoomed {
      opacity: 1;
      color: var(--green);
      background: rgba(158, 206, 106, 0.08);
      border-color: rgba(158, 206, 106, 0.45);
      cursor: not-allowed;
    }
    .narrative-zoom-btn .zoom-glyph { font-size: 12px; }

    .zoom-panel {
      margin-top: 10px;
      background: rgba(125, 207, 255, 0.04);
      border: 1px solid rgba(125, 207, 255, 0.25);
      border-radius: 6px;
      padding: 12px 14px 14px;
      display: flex; flex-direction: column; gap: 10px;
    }
    .zoom-panel-header {
      display: flex; align-items: center; gap: 10px;
      padding-bottom: 8px; border-bottom: 1px solid rgba(125, 207, 255, 0.18);
    }
    .zoom-panel-title {
      font-family: var(--font-ui); font-size: 13px; font-weight: 600;
      color: var(--text-1); letter-spacing: .02em;
    }
    .zoom-panel-kind {
      font-family: var(--font-code); font-size: 10px;
      color: var(--cyan); background: rgba(125, 207, 255, 0.12);
      border: 1px solid rgba(125, 207, 255, 0.3);
      padding: 2px 6px; border-radius: 3px;
      text-transform: uppercase; letter-spacing: .06em;
    }
    .zoom-panel-close {
      margin-left: auto;
      font-family: var(--font-ui); font-size: 11px; font-weight: 500;
      background: var(--bg-raised); color: var(--text-1);
      border: 1px solid var(--border-md); border-radius: 4px;
      padding: 4px 10px; cursor: pointer;
      display: inline-flex; align-items: center; gap: 5px;
    }
    .zoom-panel-close:hover { background: var(--bg-hover); }

    .zoom-panel-body {
      font-size: 13px; line-height: 1.65; color: var(--text-1);
    }
    .zoom-panel-body code {
      font-family: var(--font-code); font-size: 12px;
      background: rgba(255,255,255,0.06);
      padding: 1px 5px; border-radius: 3px;
    }
    .zoom-panel-body pre {
      background: rgba(0,0,0,.3); border: 1px solid var(--border);
      padding: 8px 10px; border-radius: 4px; overflow-x: auto;
      font-family: var(--font-code); font-size: 12px;
    }

    .zoom-section-title {
      font-family: var(--font-ui); font-size: 10.5px; font-weight: 600;
      color: var(--text-3); text-transform: uppercase; letter-spacing: .08em;
      margin-bottom: 2px;
    }
    .zoom-chip-row {
      display: flex; flex-wrap: wrap; gap: 6px;
    }
    .zoom-chip {
      font-family: var(--font-code); font-size: 11px;
      background: rgba(255,255,255,0.04);
      color: var(--text-1);
      border: 1px solid var(--border-md);
      border-radius: 3px; padding: 3px 8px;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .zoom-chip.clickable { cursor: pointer; transition: background .1s, border-color .1s; }
    .zoom-chip.clickable:hover { background: rgba(125, 207, 255, 0.1); border-color: rgba(125, 207, 255, 0.45); }
    .zoom-chip.tool {
      color: var(--yellow); border-color: rgba(224, 175, 104, 0.3);
      background: rgba(224, 175, 104, 0.06);
    }
    .zoom-chip-role {
      color: var(--text-3); font-size: 10.5px;
      font-family: var(--font-ui);
    }

    .zoom-loading {
      display: flex; align-items: center; gap: 8px;
      font-size: 12.5px; color: var(--text-2);
    }
    .zoom-loading::before {
      content: ""; width: 12px; height: 12px; border-radius: 50%;
      border: 2px solid rgba(125, 207, 255, 0.25);
      border-top-color: var(--cyan);
      animation: zoom-spin 0.9s linear infinite;
    }
    @keyframes zoom-spin { to { transform: rotate(360deg); } }

    .zoom-error {
      color: var(--red); font-size: 12.5px;
    }

    /* ── System tab ── */
    #layer-system { background: var(--bg-main); }
    #system-toolbar {
      position: absolute; top: 10px; right: 12px;
      display: flex; gap: 6px; z-index: 5; align-items: center;
      background: rgba(22,22,30,.75); padding: 6px 10px;
      border: 1px solid var(--border); border-radius: 6px;
      backdrop-filter: blur(6px);
    }
    #system-status {
      font-family: var(--font-code); font-size: 11px; color: var(--text-2);
      padding-right: 4px;
    }
    #system-svg { width: 100%; height: 100%; display: block; cursor: grab; }
    #system-svg:active { cursor: grabbing; }

    .system-node rect {
      transition: stroke .2s, filter .2s;
    }
    .system-node text {
      font-family: var(--font-code); font-size: 12px;
      user-select: none; pointer-events: none;
    }
    .system-node-kind {
      font-size: 9px !important; fill: var(--text-3);
      text-transform: uppercase; letter-spacing: .06em;
    }
    .system-node.active rect {
      stroke: var(--yellow) !important; stroke-width: 2.5 !important;
      filter: drop-shadow(0 0 8px rgba(224,175,104,.55));
    }

    .system-edge {
      fill: none; stroke: rgba(255,255,255,0.12); stroke-width: 1.5;
      marker-end: url(#system-arrow);
      transition: stroke .15s;
    }

      fill: none; stroke: transparent; stroke-width: 18;
      pointer-events: stroke; cursor: help;

      fill: var(--text-3); pointer-events: none;

    .system-edge-group:hover .system-edge-label,

    .system-edge-group:hover .system-edge:not(.active) {

    #system-overlay pre {

const API = "http://localhost:8000";
const _urlParams = new URLSearchParams(location.search);
const REPO_ID    = _urlParams.get("repo_id") || null;
const REPO_URL   = decodeURIComponent(_urlParams.get("url") || "");
const REPO_LABEL = REPO_URL
  ? REPO_URL.replace(/https?:\/\/(github|gitlab)\.com\//i, "")
  : (REPO_ID ? REPO_ID.slice(0, 8) + "…" : "demo");

async function forceReindex() {
  if (!REPO_URL) { alert("No repo URL — cannot re-index."); return; }
  const btn = document.getElementById("reindex-btn");
  btn.disabled = true;
  btn.textContent = "↺ Re-indexing…";
  try {
    const res = await fetch(`${API}/index`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ repo_url: REPO_URL, force: true }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || "Re-index failed");
    // Redirect back to index page so user sees progress bar
    window.location.href = `index.html?url=${encodeURIComponent(REPO_URL)}&force=1`;
  } catch (err) {
    btn.disabled = false;
    btn.textContent = "↺ Re-index";
    alert("Re-index error: " + err.message);
  }
}

// ── Canvas layer / tab control ────────────────────────────────────────────────

let currentLayer = "arch"; // "arch" | "system" | "trace" | dynamic code-* layer ids

function activateTab(name) {
  document.querySelectorAll(".ctx-tab").forEach(t => t.classList.remove("active"));
  const tab = document.getElementById(`tab-${name}`);
  if (tab) tab.classList.add("active");

  document.querySelectorAll(".canvas-layer").forEach(l => l.classList.remove("active"));
  document.getElementById(`layer-${name}`).classList.add("active");
  currentLayer = name;

  document.getElementById("arch-toolbar").style.display = name === "arch" ? "flex" : "none";
  const sysTb = document.getElementById("system-toolbar");
  if (sysTb) sysTb.style.display = name === "system" ? "flex" : "none";

  if (name === "system" && window.__systemDiagram && REPO_ID) {
    window.__systemDiagram.load(REPO_ID);
  }
}

function ensureTab(id, label, icon) {
  let tab = document.getElementById(`tab-${id}`);
  if (!tab) {
    tab = document.createElement("button");
    tab.className = "ctx-tab";
    tab.id = `tab-${id}`;
    tab.innerHTML = `${icon} ${label} <span class="tab-close" title="Close">×</span>`;
    tab.addEventListener("click", e => {
      if (e.target.classList.contains("tab-close")) {
        tab.remove();
        const layer = document.getElementById(`layer-${id}`);
        if (layer && id !== "arch" && id !== "trace") layer.remove();
        for (const [fp, lid] of openFiles) { if (lid === id) { openFiles.delete(fp); break; } }
        if (currentLayer === id) activateTab("arch");
      } else {
        activateTab(id);
      }
    });
    // Insert after last existing tab
    const tabs = document.querySelectorAll(".ctx-tab");
    tabs[tabs.length - 1].insertAdjacentElement("afterend", tab);
  } else {
    // Update label but keep close button
    tab.innerHTML = `${icon} ${label} <span class="tab-close" title="Close">×</span>`;
  }
  return tab;
}

document.getElementById("tab-arch").addEventListener("click", () => activateTab("arch"));
document.getElementById("tab-system").addEventListener("click", () => activateTab("system"));

// ── Code viewer ────────────────────────────────────────────────────────────────

const openFiles = new Map(); // filePath → layerId

function codeLayerId(filePath) {
  return "code-" + filePath.replace(/[^a-zA-Z0-9]/g, "_");
}

async function openCodeViewer(filePath, startLine, endLine) {
  const targetLine = startLine || null;
  endLine = endLine || startLine;
  let file = FILES[filePath];
  if (!file && REPO_ID) {
    try {
      const res = await fetch(`${API}/file/${encodeURIComponent(REPO_ID)}?path=${encodeURIComponent(filePath)}`);
      if (res.ok) {
        const data = await res.json();
        file = { language: data.language, content: data.content };
        FILES[filePath] = file;
      }
    } catch (_) { /* skip */ }
  }
  if (!file) return;

  const layerId = codeLayerId(filePath);
  const parts = filePath.split("/");
  const fname = parts.pop();

  // Create layer + tab if this file isn't open yet
  if (!openFiles.has(filePath)) {
    const layer = document.createElement("div");
    layer.className = "canvas-layer";
    layer.id = `layer-${layerId}`;
    layer.innerHTML =
      `<div id="code-header-${layerId}" style="background:var(--bg-deep);border-bottom:1px solid var(--border);padding:7px 16px;display:flex;align-items:center;gap:10px;flex-shrink:0;">` +
        `<span style="font-family:var(--font-code);font-size:12px;color:var(--text-2);">` +
          parts.map(p => `<span style="color:var(--text-3)">${esc(p)}/</span>`).join("") +
          `<span class="fname">${esc(fname)}</span>` +
        `</span>` +
        `<span style="margin-left:auto;font-family:var(--font-code);font-size:10px;padding:2px 6px;border-radius:3px;background:rgba(122,162,247,.1);color:var(--blue);border:1px solid rgba(122,162,247,.2);">${file.language}</span>` +
      `</div>` +
      `<div id="code-scroll-${layerId}" style="flex:1;overflow:auto;scrollbar-width:thin;scrollbar-color:var(--bg-hover) transparent;">` +
        `<div id="code-lines-${layerId}" style="padding:12px 0;"></div>` +
      `</div>`;
    document.getElementById("right-pane").appendChild(layer);

    // Render lines
    const linesEl = layer.querySelector(`#code-lines-${layerId}`);
    const grammar = Prism.languages[file.language] || Prism.languages.clike;
    file.content.split("\n").forEach((raw, i) => {
      const n = i + 1;
      const row = document.createElement("div");
      row.className = "code-line";
      row.dataset.line = n;
      row.innerHTML =
        `<span class="line-num">${n}</span>` +
        `<span class="line-content language-${file.language}">${Prism.highlight(raw, grammar, file.language) || " "}</span>`;
      linesEl.appendChild(row);
    });

    ensureTab(layerId, fname, "◧");
    openFiles.set(filePath, layerId);
  }

  // Highlight line range (clear previous highlights first)
  const linesEl = document.getElementById(`code-lines-${layerId}`);
  linesEl.querySelectorAll(".line-hl").forEach(el => el.classList.remove("line-hl"));
  if (targetLine) {
    const end = endLine || targetLine;
    for (let ln = targetLine; ln <= end; ln++) {
      const row = linesEl.querySelector(`[data-line="${ln}"]`);
      if (row) row.classList.add("line-hl");
    }
  }

  // Tab label shows file name only (no line suffix — line context is in the highlight)
  ensureTab(layerId, fname, "◧");
  activateTab(layerId);

  if (targetLine) {
    requestAnimationFrame(() => {
      const scroll = document.getElementById(`code-scroll-${layerId}`);
      const hlRow = linesEl.querySelector(`[data-line="${targetLine}"]`);
      if (hlRow && scroll) scroll.scrollTop = Math.max(0, hlRow.offsetTop - scroll.clientHeight / 2.5);
    });
  }
}

// ── Trace view ─────────────────────────────────────────────────────────────────

function openTrace(source, affected) {
  document.getElementById("trace-source-label").textContent = source;
  document.getElementById("trace-count-label").textContent =
    `${affected.length} file(s) import this module directly or transitively`;

  const list = document.getElementById("trace-list");
  list.innerHTML = "";
  affected.forEach(item => {
    const el = document.createElement("div");
    el.className = "trace-item";
    el.innerHTML = `<span class="trace-dot ${item.type}"></span>
      <span class="trace-path">${esc(item.path)}</span>
      <span class="trace-badge ${item.type}">${item.type}</span>`;
    el.addEventListener("click", () => openCodeViewer(item.path, null));
    list.appendChild(el);
  });

  const srcName = source.split("/").pop();
  ensureTab("trace", srcName, "⇢");
  activateTab("trace");
}

}

function appendMsg(role, html, response) {
  const wrap = document.createElement("div");
  wrap.className = `msg msg-${role}`;

  const label = document.createElement("span");
  label.className = "msg-label";
  label.textContent = role === "user" ? "You" : "AccliMate";
  wrap.appendChild(label);

  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.innerHTML = html;

  // Wire up inline citation chips injected by formatAnswer
  bubble.querySelectorAll(".inline-cite").forEach(chip => {
    chip.addEventListener("click", () =>
      openCodeViewer(chip.dataset.path, +chip.dataset.start, +chip.dataset.end));
  });

  if (response) {
    if (response.type === "answer" && response.citations?.length) {
      const chips = document.createElement("div");
      chips.className = "citations";
      response.citations.forEach(c => {
        const chip = document.createElement("span");
        chip.className = "cite-chip";
            const endStr = c.end_line && c.end_line !== c.start_line ? `-${c.end_line}` : '';
            chip.textContent = `${c.path}:${c.start_line}${endStr}`;
        chip.addEventListener("click", () => openCodeViewer(c.path, c.start_line, c.end_line || c.start_line));
        chips.appendChild(chip);
      });
      bubble.appendChild(chips);
    }
    if (response.type === "trace" && response.affected) {
      const chip = document.createElement("span");
      chip.className = "trace-chip";
      chip.innerHTML = `⇢ View dependency trace for ${esc(response.source.split("/").pop())}`;
      chip.addEventListener("click", () => openTrace(response.source, response.affected));
      bubble.appendChild(chip);
    }
  }

  wrap.appendChild(bubble);
  messagesEl.appendChild(wrap);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function showThinking() {
  const wrap = document.createElement("div");
  wrap.className = "msg msg-assistant"; wrap.id = "_thinking";
  const b = document.createElement("div"); b.className = "thinking";
  b.innerHTML = "<span></span><span></span><span></span>";
  wrap.appendChild(b); messagesEl.appendChild(wrap);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}
function removeThinking() { document.getElementById("_thinking")?.remove(); }

function formatAnswer(text, citations) {
  let html = esc(text);
  // Fenced code blocks (must run before inline-code)
  html = html.replace(/```[\w]*\n([\s\S]*?)```/g, (_, code) =>
    `<pre style="background:rgba(255,255,255,.05);padding:10px 14px;border-radius:6px;overflow-x:auto;font-family:var(--font-code);font-size:12px;margin:8px 0;white-space:pre-wrap"><code>${code}</code></pre>`);
  // Inline code — file paths become clickable cite-chips; other code stays <code>
  html = html.replace(/`([^`\n]+)`/g, (_, inner) => {
    // Looks like a file path: contains / or . and a recognised extension
    if (/[./]/.test(inner) && /\.(py|js|ts|tsx|jsx|go|rs|java|cpp|cs|rb|md|toml|yaml|yml|json|sh|env)$/i.test(inner.trim())) {
      const filePath = inner.trim();
      return `<span class="cite-chip inline-cite" data-path="${esc(filePath)}" data-start="0" data-end="0">${esc(filePath.split('/').pop())}</span>`;
    }
    return `<code>${inner}</code>`;
  });
  // Headings
  html = html.replace(/^### (.+)$/gm, '<strong style="font-size:13px;color:var(--text-1)">$1</strong>');
  html = html.replace(/^## (.+)$/gm,  '<strong style="font-size:14px;color:var(--text-1)">$1</strong>');
  html = html.replace(/^# (.+)$/gm,   '<strong style="font-size:15px;color:var(--text-1)">$1</strong>');
  // Bold / italic
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/\*([^*\n]+)\*/g,  '<em>$1</em>');
  // Inline citation markers [path:line] or [path:start-end] → cite-chip spans
  // path arrives already HTML-escaped from esc(text) above, so unescape before re-escaping into attrs
  html = html.replace(/\[([^\]\n]+):(\d+)(?:-(\d+))?\]/g, (match, escapedPath, start, end) => {
    const filePath = escapedPath.replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>');
    const s = parseInt(start, 10);
    const e = end ? parseInt(end, 10) : s;
    const endStr = e !== s ? `-${e}` : '';
    const fname = esc(filePath.split('/').pop());
    return `<span class="cite-chip inline-cite" data-path="${esc(filePath)}" data-start="${s}" data-end="${e}">${fname}:${s}${endStr}</span>`;
  });
  // Newlines
  html = html.replace(/\n/g, '<br>');
  return html;
}

// ── Chat mode registry ────────────────────────────────────────────────────────
// Each mode is a pluggable object implementing the contract below. Adding a new
// mode (e.g. speech-to-speech) means adding one object and a toggle button —
// no changes to the dispatcher, renderer, or input handlers.
//
// Contract:
//   id          string
//   label       string (display in toggle)
//   placeholder string (input placeholder)
//   async send(text, ctx) -> responseObj  — performs fetch, returns raw data
//   render(responseObj, bubbleEl, ctx)    — builds DOM inside the assistant bubble

async function qaSend(text) {
  const res = await fetch(`${API}/query`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ repo_id: REPO_ID, question: text, scope: currentScope || null }),
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.detail || "Query failed");
  return data;
}

function qaRender(data, bubble) {
  // If the LLM returned narrative JSON despite being in QA mode, render it properly
  const answerText = data.answer || "";
  const jsonMatch = answerText.match(/\{[\s\S]*"steps"\s*:\s*\[[\s\S]*\]/);
  if (jsonMatch) {
    try {
      const parsed = JSON.parse(jsonMatch[0]);
      if (Array.isArray(parsed.steps) && parsed.steps.length) {
        narrativeRender({ steps: parsed.steps }, bubble);
        return;
      }
    } catch (_) { /* fall through to normal QA render */ }
  }

  const citations = (data.citations || []).map(c => ({
    path: c.file_path, start_line: c.start_line, end_line: c.end_line || c.start_line,
  }));
  bubble.innerHTML = formatAnswer(answerText, citations);
  // Wire inline cite-chips injected by formatAnswer
  bubble.querySelectorAll(".inline-cite").forEach(chip => {
    chip.addEventListener("click", () =>
      openCodeViewer(chip.dataset.path, +chip.dataset.start, +chip.dataset.end));
  });
  if (citations.length) {
    const chips = document.createElement("div");
    chips.className = "citations";
    citations.forEach(c => {
      const chip = document.createElement("span");
      chip.className = "cite-chip";
      const endStr = c.end_line !== c.start_line ? `-${c.end_line}` : "";
      chip.textContent = `${c.path}:${c.start_line}${endStr}`;
      chip.addEventListener("click", () => openCodeViewer(c.path, c.start_line, c.end_line));
      chips.appendChild(chip);
    });
    bubble.appendChild(chips);
  }
}

async function narrativeSend(text) {
  const res = await fetch(`${API}/narrative/${encodeURIComponent(REPO_ID)}`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ question: text }),
  });
  const data = await res.json();
  if (!res.ok) {
    const d = data.detail;
    const msg = typeof d === "string" ? d : (d && d.message) ? d.message : "Narrative failed";
    const err = new Error(msg);
    if (d && d.raw) err.raw = d.raw;
    throw err;
  }
  return data;
}

function narrativeRender(data, bubble) {
  const steps = (data.steps || []).filter(s => s && (s.narration || "").trim().length > 0);
  if (!steps.length) {
    bubble.innerHTML = `<span style="color:var(--red)">No narrative steps returned.</span>`;
    return;
  }

  const question = data.question || "";

  bubble.innerHTML = "";
  const player = document.createElement("div");
  player.className = "narrative-player";
  bubble.appendChild(player);

  const stepEl = document.createElement("div");
  stepEl.className = "narrative-step";
  player.appendChild(stepEl);

  const citationsEl = document.createElement("div");
  citationsEl.className = "citations";
  player.appendChild(citationsEl);

  const controls = document.createElement("div");
  controls.className = "narrative-controls";
  const prevBtn = document.createElement("button");
  prevBtn.className = "narrative-nav-btn"; prevBtn.textContent = "← Prev";
  const nextBtn = document.createElement("button");
  nextBtn.className = "narrative-nav-btn"; nextBtn.textContent = "Next →";
  const replayBtn = document.createElement("button");
  replayBtn.className = "narrative-nav-btn narrative-replay-btn";
  replayBtn.innerHTML = `<span>↻</span><span>Replay</span>`;
  const stopBtn = document.createElement("button");
  stopBtn.className = "narrative-nav-btn narrative-stop-btn";
  stopBtn.innerHTML = `<span>■</span><span>Stop</span>`;
  const counter = document.createElement("span");
  counter.className = "narrative-step-counter";
  controls.append(prevBtn, nextBtn, replayBtn, stopBtn, counter);
  player.appendChild(controls);

  replayBtn.addEventListener("click", () => {
    if (!window.__systemDiagram) return;
    // Switch to System tab so the replay is visible, then re-run the step
    if (currentLayer !== "system") activateTab("system");
    window.__systemDiagram.setActiveStep(steps[idx]);
  });

  stopBtn.addEventListener("click", () => {
    if (!window.__systemDiagram) return;
    // Stop clears highlights, edge activation, and the parked particle.
    window.__systemDiagram.clearStep();
  });

  // Row holding the "Zoom into X" button (only shown when a component is highlighted)
  const zoomRow = document.createElement("div");
  zoomRow.className = "narrative-zoom-row";
  zoomRow.style.display = "none";
  const zoomBtn = document.createElement("button");
  zoomBtn.className = "narrative-zoom-btn";
  zoomBtn.innerHTML = `<span class="zoom-glyph">⤢</span><span class="zoom-label">Zoom in</span>`;
  zoomRow.appendChild(zoomBtn);
  player.appendChild(zoomRow);

  // Container for the zoom deep-dive panel (populated on demand)
  const zoomPanel = document.createElement("div");
  zoomPanel.style.display = "none";
  player.appendChild(zoomPanel);

  let idx = 0;
  let zoomTargetId = null; // the component id the current step can zoom into
  let zoomTargetLabel = null;
  let isZoomOpen = false;  // true once zoomed in; stays true until the user zooms out

  function applyZoomButtonState() {
    if (isZoomOpen) {
      zoomBtn.disabled = true;
      zoomBtn.classList.add("is-zoomed");
      zoomBtn.title = "Already zoomed in — use Zoom out to return";
      zoomBtn.querySelector(".zoom-glyph").textContent = "✓";
      zoomBtn.querySelector(".zoom-label").textContent =
        `Zoomed into ${zoomTargetLabel || zoomTargetId || "component"}`;
    } else {
      zoomBtn.classList.remove("is-zoomed");
      zoomBtn.title = "";
      zoomBtn.querySelector(".zoom-glyph").textContent = "⤢";
      // Label is set by updateZoomButton based on the active step's highlight.
    }
  }

  function closeZoomPanel() {
    zoomPanel.style.display = "none";
    zoomPanel.innerHTML = "";
    isZoomOpen = false;
    if (window.__systemDiagram) {
      window.__systemDiagram.resetZoom();
      // Replay the main animation for the current step once we're zoomed back out
      window.__systemDiagram.setActiveStep(steps[idx]);
    }
    zoomBtn.disabled = false;
    updateZoomButton(steps[idx]);
  }

  async function openZoomPanel(componentId) {
    zoomPanel.style.display = "block";
    zoomPanel.innerHTML = `<div class="zoom-loading">Zooming into component…</div>`;
    zoomBtn.disabled = true;

    if (window.__systemDiagram) window.__systemDiagram.zoomToNode(componentId);

    try {
      const res = await fetch(`${API}/zoom/${encodeURIComponent(REPO_ID)}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          component_id: componentId,
          question,
          narration: steps[idx]?.narration || "",
        }),
      });
      const zd = await res.json();
      if (!res.ok) {
        const d = zd.detail;
        const msg = typeof d === "string" ? d : (d && d.message) ? d.message : "Zoom failed";
        zoomPanel.innerHTML = `<div class="zoom-error">${esc(msg)}</div>`;
        isZoomOpen = false;
        zoomBtn.disabled = false;
        applyZoomButtonState();
        return;
      }
      renderZoomDetail(zd);
      isZoomOpen = true;
      // Keep the label fresh in case the LLM returned a different resolved label
      zoomTargetLabel = zd.component_label || zoomTargetLabel;
      applyZoomButtonState();
    } catch (err) {
      zoomPanel.innerHTML = `<div class="zoom-error">${esc(String(err.message || err))}</div>`;
      isZoomOpen = false;
      zoomBtn.disabled = false;
      applyZoomButtonState();
    }
  }

  function renderZoomDetail(zd) {
    zoomPanel.innerHTML = "";
    const panel = document.createElement("div");
    panel.className = "zoom-panel";

    const header = document.createElement("div");
    header.className = "zoom-panel-header";
    const title = document.createElement("span");
    title.className = "zoom-panel-title";
    title.textContent = zd.component_label || zd.component_id || "Component";
    const kind = document.createElement("span");
    kind.className = "zoom-panel-kind";
    kind.textContent = zd.component_kind || "";
    const closeBtn = document.createElement("button");
    closeBtn.className = "zoom-panel-close";
    closeBtn.innerHTML = `<span>⤡</span><span>Zoom out</span>`;
    closeBtn.addEventListener("click", closeZoomPanel);
    header.append(title, kind, closeBtn);
    panel.appendChild(header);

    const body = document.createElement("div");
    body.className = "zoom-panel-body";
    const zoomCitations = (zd.citations || []).map(c => ({
      path: c.file_path, start_line: c.start_line, end_line: c.end_line || c.start_line,
    }));
    body.innerHTML = formatAnswer(zd.deep_dive || "", zoomCitations);
    body.querySelectorAll(".inline-cite").forEach(chip => {
      chip.addEventListener("click", () =>
        openCodeViewer(chip.dataset.path, +chip.dataset.start, +chip.dataset.end));
    });
    panel.appendChild(body);

    if ((zd.involved_files || []).length) {
      const sec = document.createElement("div");
      sec.className = "zoom-section";
      const t = document.createElement("div");
      t.className = "zoom-section-title"; t.textContent = "Files";
      const row = document.createElement("div");
      row.className = "zoom-chip-row";
      zd.involved_files.forEach(f => {
        const chip = document.createElement("span");
        chip.className = "zoom-chip clickable";
        const path = document.createElement("span");
        const fEndStr = f.end_line && f.end_line !== f.start_line ? `-${f.end_line}` : "";
        path.textContent = f.start_line ? `${f.file_path}:${f.start_line}${fEndStr}` : f.file_path;
        chip.appendChild(path);
        if (f.role) {
          const r = document.createElement("span");
          r.className = "zoom-chip-role";
          r.textContent = "— " + f.role;
          chip.appendChild(r);
        }
        chip.addEventListener("click", () => openCodeViewer(f.file_path, f.start_line || null, f.end_line || f.start_line || null));
        row.appendChild(chip);
      });
      sec.append(t, row);
      panel.appendChild(sec);
    }

    if ((zd.tools || []).length) {
      const sec = document.createElement("div");
      sec.className = "zoom-section";
      const t = document.createElement("div");
      t.className = "zoom-section-title"; t.textContent = "Tools & libraries";
      const row = document.createElement("div");
      row.className = "zoom-chip-row";
      zd.tools.forEach(tool => {
        const chip = document.createElement("span");
        chip.className = "zoom-chip tool";
        chip.textContent = tool;
        row.appendChild(chip);
      });
      sec.append(t, row);
      panel.appendChild(sec);
    }

    if ((zd.citations || []).length) {
      const sec = document.createElement("div");
      sec.className = "zoom-section";
      const t = document.createElement("div");
      t.className = "zoom-section-title"; t.textContent = "Citations";
      const row = document.createElement("div");
      row.className = "zoom-chip-row";
      zd.citations.forEach(c => {
        const chip = document.createElement("span");
        chip.className = "zoom-chip clickable";
        const cEnd = c.end_line || c.start_line || null;
        const cEndStr = cEnd && cEnd !== c.start_line ? `-${cEnd}` : "";
        chip.textContent = c.start_line ? `${c.file_path}:${c.start_line}${cEndStr}` : c.file_path;
        chip.addEventListener("click", () => openCodeViewer(c.file_path, c.start_line || null, cEnd));
        row.appendChild(chip);
      });
      sec.append(t, row);
      panel.appendChild(sec);
    }

    zoomPanel.appendChild(panel);
  }

  function updateZoomButton(step) {
    const highlights = Array.isArray(step.highlight) ? step.highlight : [];
    if (!highlights.length || !window.__systemDiagram) {
      zoomRow.style.display = "none";
      zoomTargetId = null;
      zoomTargetLabel = null;
      return;
    }
    // Pick the first highlighted component we can resolve. If the diagram
    // hasn't loaded yet, fall back to the raw id so the label still renders.
    let targetId = highlights[0];
    let label = targetId;
    for (const h of highlights) {
      const comp = window.__systemDiagram.getComponent?.(h);
      if (comp) {
        targetId = comp.id;
        label = comp.label || comp.id;
        break;
      }
    }
    zoomTargetId = targetId;
    zoomTargetLabel = label;
    zoomRow.style.display = "flex";
    if (isZoomOpen) {
      applyZoomButtonState();
    } else {
      zoomBtn.querySelector(".zoom-label").textContent = `Zoom into ${label}`;
    }
  }

  zoomBtn.addEventListener("click", () => {
    if (!zoomTargetId) return;
    openZoomPanel(zoomTargetId);
  });

  function renderStep(i) {
    // Close any open zoom panel when navigating between steps
    if (zoomPanel.style.display !== "none") {
      zoomPanel.style.display = "none";
      zoomPanel.innerHTML = "";
      if (window.__systemDiagram) window.__systemDiagram.resetZoom();
    }
    isZoomOpen = false;
    zoomBtn.disabled = false;

    idx = Math.max(0, Math.min(steps.length - 1, i));
    const s = steps[idx];
    const stepCitations = (s.citations || []).map(c => ({
      path: c.file_path, start_line: c.start_line, end_line: c.end_line || c.start_line,
    }));
    stepEl.innerHTML = formatAnswer(s.narration || "", stepCitations);
    stepEl.querySelectorAll(".inline-cite").forEach(chip => {
      chip.addEventListener("click", () =>
        openCodeViewer(chip.dataset.path, +chip.dataset.start, +chip.dataset.end));
    });

    citationsEl.innerHTML = "";
    stepCitations.forEach(c => {
      const chip = document.createElement("span");
      chip.className = "cite-chip";
      const endStr = c.end_line !== c.start_line ? `-${c.end_line}` : "";
      chip.textContent = `${c.path}:${c.start_line}${endStr}`;
      chip.addEventListener("click", () => openCodeViewer(c.path, c.start_line, c.end_line));
      citationsEl.appendChild(chip);
    });

    counter.textContent = `Step ${idx + 1} / ${steps.length}`;
    prevBtn.disabled = idx === 0;
    nextBtn.disabled = idx === steps.length - 1;

    // Auto-switch to System tab so the user can see the new action, and
    // kick off the one-shot animation for this step.
    if (currentLayer !== "system") activateTab("system");
    if (window.__systemDiagram) {
      if (window.__systemDiagram.isLoaded()) {
        window.__systemDiagram.setActiveStep(s);
      } else {
        // Diagram still loading — wait for it then apply the step
        const waitAndApply = setInterval(() => {
          if (window.__systemDiagram.isLoaded()) {
            clearInterval(waitAndApply);
            window.__systemDiagram.setActiveStep(s);
          }
        }, 300);
      }
    }

    updateZoomButton(s);
    applyZoomButtonState();
  }

  prevBtn.addEventListener("click", () => renderStep(idx - 1));
  nextBtn.addEventListener("click", () => renderStep(idx + 1));
  renderStep(0);
}

const ChatModes = {
  qa: {
    id: "qa",
    label: "Q&A",
    placeholder: "Ask anything about this codebase…",
    send: qaSend,
    render: qaRender,
  },
  narrative: {
    id: "narrative",
    label: "Narrative",
    placeholder: "Ask me to narrate a flow — e.g. how does a user's question reach the database?",
    send: narrativeSend,
    render: narrativeRender,
  },
  // future modes (speech-to-speech, debate, etc.) plug in here
};

let currentMode = ChatModes.qa;

function setChatMode(modeId) {
  const mode = ChatModes[modeId];
  if (!mode) return;
  currentMode = mode;
  inputEl.placeholder = mode.placeholder;
  document.querySelectorAll(".mode-btn").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.mode === mode.id);
  });
}

document.querySelectorAll(".mode-btn").forEach(btn => {
  btn.addEventListener("click", () => setChatMode(btn.dataset.mode));
});

async function sendMessage() {
  const text = inputEl.value.trim();
  if (!text) return;
  const mode = currentMode;
  inputEl.value = ""; inputEl.style.height = "auto";
  sendBtn.disabled = true;
  appendMsg("user", esc(text));
  showThinking();

  // Build an empty assistant bubble upfront so mode.render can populate it
  try {
    const data = await mode.send(text, { REPO_ID, API });
    removeThinking();
    const wrap = document.createElement("div");
    wrap.className = "msg msg-assistant";
    const label = document.createElement("span");
    label.className = "msg-label"; label.textContent = "Nemotron";
    wrap.appendChild(label);
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    wrap.appendChild(bubble);
    messagesEl.appendChild(wrap);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    mode.render(data, bubble, { REPO_ID, API });
    messagesEl.scrollTop = messagesEl.scrollHeight;
  } catch (err) {
    removeThinking();
    let html = `<span style="color:var(--red)">${esc(String(err.message || err))}</span>`;
    if (err.raw) {
      html += `<details style="margin-top:8px"><summary style="cursor:pointer;color:var(--text-3);font-size:11px">Show raw response</summary>`
           +  `<pre style="background:rgba(0,0,0,.25);color:var(--text-2);font-family:var(--font-code);font-size:11px;padding:8px;border-radius:4px;white-space:pre-wrap;margin-top:6px">${esc(err.raw)}</pre></details>`;
    }
    appendMsg("assistant", html, null);
  } finally {
    sendBtn.disabled = false;
  }
}

sendBtn.addEventListener("click", sendMessage);
inputEl.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); } });
inputEl.addEventListener("input", () => { inputEl.style.height = "auto"; inputEl.style.height = Math.min(inputEl.scrollHeight, 200) + "px"; });
// Set initial placeholder from the default mode
inputEl.placeholder = currentMode.placeholder;

// ── Architecture D3 ────────────────────────────────────────────────────────────

function _buildArchTree(files, repoLabel) {
  const root = { id: "/", name: repoLabel || "repo", type: "folder", children: [] };
  const map = { "/": root };
  const langMap = { py:"python", js:"javascript", ts:"typescript", tsx:"tsx", jsx:"javascript",
    go:"go", rs:"rust", java:"java", cpp:"cpp", cs:"c_sharp" };
  files.sort().forEach(filePath => {
    const parts = filePath.split("/");
    let parentId = "/";
    parts.forEach((part, i) => {
      const isLeaf = i === parts.length - 1;
      const nodeId = parentId === "/" ? part : parentId + "/" + part;
      if (!map[nodeId]) {
        const ext = part.split(".").pop();
        const node = {
          id: nodeId, name: part,
          type: isLeaf ? "file" : "folder",
          language: isLeaf ? (langMap[ext] || "unknown") : undefined,
          children: isLeaf ? undefined : [],
        };
        map[nodeId] = node;
        (map[parentId].children = map[parentId].children || []).push(node);
      }
      parentId = nodeId;
    });
  });
  return root;
}

function initArch(treeData) {
  const container = document.getElementById("layer-arch");
  const W = container.clientWidth || 800;
  const H = container.clientHeight || 600;
  const svg = d3.select("#arch-svg");
  svg.selectAll("*").remove();
  const g = svg.append("g");

  const zoom = d3.zoom().scaleExtent([0.15, 4]).on("zoom", e => g.attr("transform", e.transform));
  svg.call(zoom);

  // Fit the current visible tree to the viewport with padding
  function fitView(duration = 350) {
    requestAnimationFrame(() => {
      const bbox = g.node().getBBox();
      if (!bbox.width || !bbox.height) return;
      const cw = container.clientWidth || W;
      const ch = container.clientHeight || H;
      const pad = 32;
      const scale = Math.min(1, (cw - pad * 2) / bbox.width, (ch - pad * 2) / bbox.height);
      const tx = (cw - bbox.width * scale) / 2 - bbox.x * scale;
      const ty = (ch - bbox.height * scale) / 2 - bbox.y * scale;
      svg.transition().duration(duration)
        .call(zoom.transform, d3.zoomIdentity.translate(tx, ty).scale(scale));
    });
  }

  const root = d3.hierarchy(treeData);
  root.x0 = H / 2; root.y0 = 0;
  // Collapse depth ≥ 2 on load — keep top-level folders visible
  root.descendants().forEach(d => {
    if (d.depth >= 2 && d.children) { d._children = d.children; d.children = null; }
  });

  // Separate layers: links always behind nodes
  const gLinks = g.append("g").attr("class", "arch-links");
  const gNodes = g.append("g").attr("class", "arch-nodes");

  const tree = d3.tree().nodeSize([24, 220]);
  const LANG_COLOR = { python:"#4B8BBE", javascript:"#F7DF1E", typescript:"#3178C6",
    tsx:"#3178C6", go:"#00ADD8", rust:"#CE422B", java:"#ED8B00", cpp:"#659AD2", unknown:"#6B7280" };

  function update(src) {
    const q = (document.getElementById("arch-search")?.value || "").toLowerCase();
    tree(root);
    const nodes = root.descendants(), links = root.links();

    const link = gLinks.selectAll(".al").data(links, d => d.target.data.id);
    link.enter().append("path").attr("class","al")
      .attr("fill","none").attr("stroke","rgba(255,255,255,0.07)").attr("stroke-width",1)
      .merge(link).transition().duration(220)
      .attr("d", d3.linkHorizontal().x(d => d.y).y(d => d.x));
    link.exit().remove();

    const node = gNodes.selectAll(".an").data(nodes, d => d.data.id);
    const enter = node.enter().append("g").attr("class","an")
      .attr("transform", `translate(${src.y0},${src.x0})`).style("cursor","pointer")
      .on("click", (_, d) => {
        if (d.data.type === "file") { openCodeViewer(d.data.id, null); return; }
        if (d.children) { d._children = d.children; d.children = null; }
        else { d.children = d._children; d._children = null; }
        update(d);
      });
    enter.append("circle").attr("r",5).attr("stroke","rgba(255,255,255,0.1)").attr("stroke-width",1);
    enter.append("rect").attr("class","an-lbg").attr("fill","var(--bg-main)").attr("rx",2).attr("ry",2);
    enter.append("text").attr("dy","0.32em").attr("font-family","var(--font-code)").attr("font-size","11px").attr("fill","var(--text-2)");

    const m = enter.merge(node);
    m.transition().duration(220).attr("transform", d => `translate(${d.y},${d.x})`);
    m.select("circle").attr("fill", d =>
      d.data.type === "folder" ? (d.children ? "#6B7280" : "#374151") : (LANG_COLOR[d.data.language] || LANG_COLOR.unknown)
    )
      .attr("r", d => (q && d.data.name.toLowerCase().includes(q)) ? 7 : 5)
      .attr("stroke", d => (q && d.data.name.toLowerCase().includes(q)) ? "var(--cyan)" : "rgba(255,255,255,0.1)")
      .attr("stroke-width", d => (q && d.data.name.toLowerCase().includes(q)) ? 2 : 1);

    m.select("text")
      .attr("x", d => (d.children || d._children) ? -9 : 9)
      .attr("text-anchor", d => (d.children || d._children) ? "end" : "start")
      .attr("fill", "var(--text-2)")
      .attr("font-weight", "normal")
      .each(function(d) {
        const el = d3.select(this);
        el.selectAll("tspan").remove();
        const name = d.data.name;
        const idx = q ? name.toLowerCase().indexOf(q) : -1;
        if (idx >= 0) {
          if (idx > 0) el.append("tspan").text(name.slice(0, idx));
          el.append("tspan").attr("fill", "var(--cyan)").attr("font-weight", "600")
            .text(name.slice(idx, idx + q.length));
          if (idx + q.length < name.length)
            el.append("tspan").text(name.slice(idx + q.length));
        } else {
          el.append("tspan").text(name);
        }
      });

    node.exit().transition().duration(220).attr("transform", `translate(${src.y},${src.x})`).remove();
    nodes.forEach(d => { d.x0 = d.x; d.y0 = d.y; });

    // Size background rects to cover each label — run after paint so getBBox is valid
    requestAnimationFrame(() => {
      gNodes.selectAll(".an").each(function() {
        const grp = d3.select(this);
        const t = grp.select("text").node();
        if (!t) return;
        try {
          const bb = t.getBBox();
          grp.select(".an-lbg")
            .attr("x", bb.x - 2).attr("y", bb.y - 1)
            .attr("width", Math.max(0, bb.width + 4))
            .attr("height", bb.height + 2);
        } catch (_) {}
      });
    });
  }

  update(root);
  // Fit after animation completes
  setTimeout(() => fitView(0), 260);

  window.archExpandAll = () => {
    function expandAll(d) {
      if (d._children) { d.children = d._children; d._children = null; }
      if (d.children) d.children.forEach(expandAll);
    }
    expandAll(root);
    update(root);
    setTimeout(() => fitView(), 260);
  };
  window.archCollapseAll = () => {
    root.descendants().forEach(d => {
      if (d.depth >= 0 && d.children) { d._children = d.children; d.children = null; }
    });
    update(root);
    setTimeout(() => fitView(), 260);
  };
  window.resetArchZoom = () => fitView();

  window.archSearch = (query) => {
    const q = query.toLowerCase();
    if (q) {
      root.eachBefore(d => {
        if (d.data.name.toLowerCase().includes(q)) {
          let p = d.parent;
          while (p) {
            if (p._children) { p.children = p._children; p._children = null; }
            p = p.parent;
          }
        }
      });
    }
    update(root);
  };
}

// ── System diagram (logical components) ───────────────────────────────────────

(function initSystemDiagram() {
  const KIND_COLOR = {
    ui:       "#7aa2f7",  // blue
    service:  "#bb9af7",  // purple
    database: "#9ece6a",  // green
    external: "#e0af68",  // yellow
    queue:    "#7dcfff",  // cyan
    worker:   "#f7768e",  // red
    cache:    "#c0caf5",  // light
  };

  let _sysData = null;
  let _sysLoaded = false;
  let _sysLoading = false;
  let _sysSim = null;
  let _sysNodes = null;       // d3 selection of .system-node groups
  let _sysEdges = null;       // d3 selection of .system-edge paths
  let _sysSvg = null;
  let _sysG = null;
  let _sysZoom = null;
  let _stepToken = 0;  // increments on every clearStep/setActiveStep so old animation loops exit

  function showOverlay(text, isError, raw) {
    const el = document.getElementById("system-overlay");
    const txt = document.getElementById("system-overlay-text");
    el.classList.toggle("error", !!isError);
    el.classList.add("visible");
    txt.innerHTML = "";
    const msg = document.createElement("div");
    msg.textContent = text;
    txt.appendChild(msg);
    if (raw) {
      const pre = document.createElement("pre");
      pre.textContent = raw;
      txt.appendChild(pre);
    }
  }

  function hideOverlay() {
    document.getElementById("system-overlay").classList.remove("visible");
  }

  async function load(repoId, opts = {}) {
    if (_sysLoaded && !opts.force) return;
    if (_sysLoading) return;
    _sysLoading = true;
    showOverlay("Analyzing system architecture…", false);
    try {
      const url = opts.force
        ? `${API}/system/${encodeURIComponent(repoId)}/regenerate`
        : `${API}/system/${encodeURIComponent(repoId)}`;
      const res = await fetch(url, { method: opts.force ? "POST" : "GET" });
      const data = await res.json();
      if (!res.ok) {
        const d = data.detail;
        const msg = typeof d === "string" ? d : (d && d.message) ? d.message : "Failed to load system diagram";
        const raw = d && d.raw ? d.raw : null;
        showOverlay(msg, true, raw);
        return;
      }
      _sysData = data;
      _sysLoaded = true;
      _render();
      hideOverlay();
    } catch (err) {
      showOverlay(String(err.message || err), true);
    } finally {
      _sysLoading = false;
    }
  }

  function _render() {
    const container = document.getElementById("layer-system");
    const W = container.clientWidth  || 900;
    const H = container.clientHeight || 620;

    _sysSvg = d3.select("#system-svg").attr("viewBox", [0, 0, W, H]);
    // Clear any previous render but keep the <defs> (arrow markers)
    _sysSvg.selectAll("g.system-root").remove();

    _sysG = _sysSvg.append("g").attr("class", "system-root");

    _sysZoom = d3.zoom().scaleExtent([0.3, 3]).on("zoom", e => _sysG.attr("transform", e.transform));
    _sysSvg.call(_sysZoom);

    const components = (_sysData.components || []).map(c => ({...c}));
    const edges = (_sysData.edges || []).map(e => ({
      ...e, source: e.from, target: e.to,
    }));

    // Update toolbar status
    document.getElementById("system-status").textContent =
      `${components.length} components · ${edges.length} edges`;

    // Seed positions using kind so layout is more readable. Spread nodes
    // across more of the vertical space so we don't start with stacks of 2-3
    // components on top of each other.
    const LANES = { ui: 0.12, service: 0.5, cache: 0.6, queue: 0.65, worker: 0.55, database: 0.88, external: 0.88 };
    const n = Math.max(components.length, 1);
    components.forEach((c, i) => {
      const laneX = (LANES[c.kind] ?? 0.5) * W;
      c.x = laneX + (Math.random() - 0.5) * 60;
      c.y = H * (0.12 + (i / n) * 0.76) + (Math.random() - 0.5) * 50;
    });

    // Force simulation — spacings tuned so the dormant graph breathes rather
    // than clumping. Weaker lane pull + stronger repulsion + bigger collide
    // radius = components don't sit on top of each other.
    _sysSim = d3.forceSimulation(components)
      .force("link", d3.forceLink(edges).id(d => d.id).distance(230).strength(0.35))
      .force("charge", d3.forceManyBody().strength(-1400))
      .force("collide", d3.forceCollide().radius(d => Math.max((d._w || 140) / 2, 60) + 24))
      .force("x", d3.forceX(c => (LANES[c.kind] ?? 0.5) * W).strength(0.12))
      .force("y", d3.forceY(H / 2).strength(0.03))
      .alphaDecay(0.028);

    // Edges layer — each edge is a group containing a wide invisible hit path,
    // the visible arc, and its label. Grouping lets CSS show the label on
    // :hover without needing JS mouse handlers per edge.
    const edgeLayer = _sysG.append("g").attr("class", "system-edges");
    const edgeGroups = edgeLayer.selectAll("g").data(edges).enter()
      .append("g")
      .attr("class", "system-edge-group")
      .attr("data-edge-id", d => d.id);

    const edgeHits = edgeGroups.append("path")
      .attr("class", "system-edge-hit");

    _sysEdges = edgeGroups.append("path")
      .attr("class", "system-edge")
      .attr("data-edge-id", d => d.id);

    const edgeLabels = edgeGroups.append("text")
      .attr("class", "system-edge-label")
      .attr("data-edge-id", d => d.id)
      .attr("text-anchor", "middle")
      .text(d => d.label || "");

    // Node layer
    const nodeLayer = _sysG.append("g").attr("class", "system-nodes");
    _sysNodes = nodeLayer.selectAll("g").data(components).enter()
      .append("g")
      .attr("class", "system-node")
      .attr("data-id", d => d.id)
      .style("cursor", "grab")
      .call(d3.drag()
        .on("start", (e, d) => { if (!e.active) _sysSim.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
        .on("drag",  (e, d) => { d.fx = e.x; d.fy = e.y; })
        .on("end",   (e, d) => { if (!e.active) _sysSim.alphaTarget(0); d.fx = null; d.fy = null; })
      );

    _sysNodes.append("rect")
      .attr("rx", 8).attr("ry", 8)
      .attr("fill", d => "rgba(36, 36, 58, 0.92)")
      .attr("stroke", d => KIND_COLOR[d.kind] || "#6B7280")
      .attr("stroke-width", 1.5);

    _sysNodes.append("text")
      .attr("class", "system-node-label")
      .attr("fill", "#e4e4f0")
      .attr("x", 0).attr("y", -2)
      .attr("text-anchor", "middle")
      .text(d => d.label || d.id);

    _sysNodes.append("text")
      .attr("class", "system-node-kind")
      .attr("x", 0).attr("y", 14)
      .attr("text-anchor", "middle")
      .text(d => d.kind || "");

    // Size each rect to fit its label
    _sysNodes.each(function(d) {
      const g = d3.select(this);
      const labelNode = g.select(".system-node-label").node();
      const bbox = labelNode.getBBox();
      const w = Math.max(120, bbox.width + 28);
      const h = 42;
      g.select("rect")
        .attr("x", -w / 2).attr("y", -h / 2)
        .attr("width", w).attr("height", h);
      d._w = w; d._h = h;
    });

    _sysSim.on("tick", () => {
      const pathFor = d => {
        const sx = d.source.x, sy = d.source.y, tx = d.target.x, ty = d.target.y;
        const dx = tx - sx, dy = ty - sy;
        const dr = Math.sqrt(dx * dx + dy * dy) * 1.4 || 1;
        return `M${sx},${sy}A${dr},${dr} 0 0,1 ${tx},${ty}`;
      };
      _sysEdges.attr("d", pathFor);
      edgeHits.attr("d", pathFor);
      edgeLabels
        .attr("x", d => (d.source.x + d.target.x) / 2)
        .attr("y", d => (d.source.y + d.target.y) / 2 - 4);
      _sysNodes.attr("transform", d => `translate(${d.x},${d.y})`);
    });
  }

  function clearStep() {
    _stepToken++;
    if (!_sysSvg) return;
    _sysSvg.selectAll(".system-node").classed("active", false);
    _sysSvg.selectAll(".system-edge")
      .classed("active", false)
      .attr("marker-end", "url(#system-arrow)")
      .attr("marker-start", null);
    _sysSvg.selectAll(".system-edge-label").classed("active", false);
    _sysSvg.selectAll(".system-particle, .system-particle-label").remove();
  }

  function setActiveStep(step) {
    if (!_sysSvg || !step) return;
    clearStep();
    const myToken = ++_stepToken;

    // Highlight components
    const highlight = new Set(step.highlight || []);
    _sysSvg.selectAll(".system-node")
      .classed("active", d => highlight.has(d.id));

    // Animate data flow along the named edge
    const anim = step.animate;
    if (!anim || !anim.edge) return;

    const edgePath = _sysSvg.select(`path.system-edge[data-edge-id="${anim.edge}"]`);
    if (edgePath.empty()) return;

    const reversed = anim.direction === "reverse";
    edgePath.classed("active", true)
      .attr("marker-end",   reversed ? null : "url(#system-arrow-active)")
      .attr("marker-start", reversed ? "url(#system-arrow-active)" : null);
    // Reveal the label for the active edge (stays visible until clearStep)
    _sysSvg.select(`.system-edge-label[data-edge-id="${anim.edge}"]`).classed("active", true);

    const pathNode = edgePath.node();

    const particle = _sysG.append("circle")
      .attr("class", "system-particle")
      .attr("r", 5);

    let labelEl = null;
    if (anim.label) {
      labelEl = _sysG.append("text")
        .attr("class", "system-particle-label")
        .attr("text-anchor", "middle")
        .attr("dy", -10)
        .text(anim.label);
    }

    const duration = 1400;
    const started = performance.now();

    function frame(now) {
      // Exit if a newer step replaced us, or the particle was removed
      if (myToken !== _stepToken) return;
      if (!particle.node() || !particle.node().parentNode) return;

      const cycle = now - started;
      const totalLen = pathNode.getTotalLength();
      if (cycle < duration) {
        const t = cycle / duration;
        const tt = reversed ? 1 - t : t;
        const pt = pathNode.getPointAtLength(totalLen * tt);
        particle.attr("cx", pt.x).attr("cy", pt.y);
        if (labelEl) labelEl.attr("x", pt.x).attr("y", pt.y);
        requestAnimationFrame(frame);
      } else {
        // One-shot animation ends — remove particle + trail label so the diagram is clean.
        particle.remove();
        if (labelEl) labelEl.remove();
      }
    }
    requestAnimationFrame(frame);
  }

  function zoomToNode(nodeId, opts = {}) {
    if (!_sysSvg || !_sysZoom) return;
    const sel = _sysSvg.select(`.system-node[data-id="${nodeId}"]`);
    if (sel.empty()) return;
    const d = sel.datum();
    if (!d || d.x == null || d.y == null) return;

    const container = document.getElementById("layer-system");
    const W = container.clientWidth  || 900;
    const H = container.clientHeight || 620;
    const scale = opts.scale || 1.8;
    // Center the node in the viewport at the requested scale.
    const tx = W / 2 - d.x * scale;
    const ty = H / 2 - d.y * scale;
    _sysSvg.transition().duration(600)
      .call(_sysZoom.transform, d3.zoomIdentity.translate(tx, ty).scale(scale));
  }

  function resetZoom() {
    if (!_sysSvg || !_sysZoom) return;
    _sysSvg.transition().duration(500)
      .call(_sysZoom.transform, d3.zoomIdentity);
  }

  function getComponent(nodeId) {
    if (!_sysData) return null;
    return (_sysData.components || []).find(c => c.id === nodeId) || null;
  }

  window.__systemDiagram = {
    load,
    setActiveStep,
    clearStep,
    zoomToNode,
    resetZoom,
    getComponent,
    isLoaded: () => _sysLoaded,
    reload: (repoId) => { _sysLoaded = false; _sysData = null; load(repoId, { force: true }); },
  };

  // "Regenerate" button bypasses the cache
  document.getElementById("system-regen-btn")?.addEventListener("click", () => {
    if (REPO_ID) window.__systemDiagram.reload(REPO_ID);
  });
})();

});
