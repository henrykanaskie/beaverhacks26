<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nemotron RAG — Workspace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-deep:   #16161e;
      --bg-main:   #1e1e2e;
      --bg-raised: #24243a;
      --bg-hover:  #2d2d45;
      --bg-active: #333350;
      --border:    rgba(255,255,255,0.07);
      --border-md: rgba(255,255,255,0.12);
      --text-1: #e4e4f0;
      --text-2: #9898b8;
      --text-3: #55556a;
      --blue:   #7aa2f7;
      --purple: #bb9af7;
      --cyan:   #7dcfff;
      --green:  #9ece6a;
      --yellow: #e0af68;
      --red:    #f7768e;
      --font-ui:   'Inter', system-ui, sans-serif;
      --font-code: 'JetBrains Mono', 'Fira Code', Consolas, monospace;
    }

    html, body {
      height: 100%; overflow: hidden;
      background: var(--bg-main); color: var(--text-1);
      font-family: var(--font-ui); font-size: 14px; line-height: 1.5;
    }

    /* ── Top bar ── */
    #topbar {
      height: 40px; background: var(--bg-deep);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; padding: 0 16px; gap: 10px; flex-shrink: 0;
    }
    .logo { font-size: 13px; font-weight: 600; color: var(--purple); letter-spacing: .02em; }
    .repo { font-family: var(--font-code); font-size: 12px; color: var(--text-2); }
    .sep  { color: var(--text-3); }
    .demo-pill {
      font-size: 11px; padding: 2px 8px; border-radius: 4px;
      background: rgba(224,175,104,.12); color: var(--yellow);
      border: 1px solid rgba(224,175,104,.22);
    }
    .indexed-badge {
      margin-left: auto; font-size: 11px; font-family: var(--font-code);
      padding: 2px 8px; border-radius: 4px;
      background: rgba(158,206,106,.12); color: var(--green);
      border: 1px solid rgba(158,206,106,.22);
    }

    /* ── Shell ── */
    #app { display: flex; height: calc(100vh - 40px); overflow: hidden; }

    /* ── Left pane — chat ── */
    #left-pane {
      width: 38%; min-width: 260px; max-width: 58%; flex-shrink: 0;
      display: flex; flex-direction: column;
      background: var(--bg-raised); border-right: 1px solid var(--border); overflow: hidden;
    }
    #chat-header {
      padding: 10px 16px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 8px; flex-shrink: 0; flex-wrap: wrap;
    }
    .chat-toggles {
      display: inline-flex; flex-wrap: wrap; align-items: center; gap: 10px;
    }
    .mode-toggle input[type="checkbox"]:disabled {
      opacity: 0.5; cursor: not-allowed;
    }
    #chat-header h2 {
      font-size: 11px; font-weight: 600; text-transform: uppercase;
      letter-spacing: .08em; color: var(--text-2);
    }
    .scope-pill {
      margin-left: auto; font-family: var(--font-code); font-size: 11px;
      padding: 2px 9px; border-radius: 10px;
      background: rgba(122,162,247,.1); color: var(--blue);
      border: 1px solid rgba(122,162,247,.2); cursor: pointer;
    }
    .scope-pill:hover { background: rgba(122,162,247,.18); }

    .stream-status {
      display: inline-flex; align-items: center; gap: 8px;
      font-style: italic; color: var(--text-3); font-size: 13px;
      transition: opacity .2s;
    }
    .stream-status::before {
      content: ""; width: 6px; height: 6px; border-radius: 50%;
      background: var(--blue); animation: pulse 1.2s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100% { opacity:.3; } 50% { opacity:1; } }

    /* Typing cursor for streaming text */
    .streaming-cursor::after {
      content: "▊"; color: var(--blue); animation: cursor-blink .6s steps(2) infinite;
      margin-left: 1px;
    }
    @keyframes cursor-blink { 0% { opacity:1; } 50% { opacity:0; } }
    .mode-badge {
      display: inline-block; font-family: var(--font-code); font-size: 10px;
      padding: 1px 6px; border-radius: 3px; margin-top: 6px;
      background: rgba(187,154,247,.1); color: var(--purple);
      border: 1px solid rgba(187,154,247,.2);
    }
    .mode-badge.deep { background: rgba(125,207,255,.08); color: var(--cyan); border-color: rgba(125,207,255,.2); }

    #messages {
      flex: 1; overflow-y: auto; padding: 16px;
      display: flex; flex-direction: column; gap: 18px;
      scrollbar-width: thin; scrollbar-color: var(--bg-hover) transparent;
    }
    .msg { display: flex; flex-direction: column; gap: 4px; }
    .msg-label { font-size: 11px; color: var(--text-3); padding: 0 2px; }
    .msg-user .msg-label { align-self: flex-end; }

    .msg-user .bubble {
      align-self: flex-end; max-width: 88%;
      background: rgba(122,162,247,.1); border: 1px solid rgba(122,162,247,.2);
      border-radius: 12px 12px 2px 12px; padding: 10px 14px;
    }
    .msg-assistant .bubble {
      align-self: flex-start; max-width: 96%;
      background: var(--bg-active); border: 1px solid var(--border-md);
      border-radius: 2px 12px 12px 12px; padding: 12px 14px;
      font-size: 13.5px; line-height: 1.7;
    }
    .msg-assistant .bubble code {
      font-family: var(--font-code); font-size: 12px;
      background: rgba(255,255,255,.07); padding: 1px 5px; border-radius: 3px; color: var(--cyan);
    }

    .citations { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .cite-chip {
      font-family: var(--font-code); font-size: 11px; padding: 3px 9px; border-radius: 4px;
      background: rgba(125,207,255,.08); border: 1px solid rgba(125,207,255,.2);
      color: var(--cyan); cursor: pointer; white-space: nowrap; transition: background .12s, border-color .12s;
    }
    .cite-chip:hover { background: rgba(125,207,255,.18); border-color: rgba(125,207,255,.4); }

    .trace-chip {
      display: inline-flex; align-items: center; gap: 6px;
      font-family: var(--font-code); font-size: 11px; padding: 3px 9px; border-radius: 4px;
      background: rgba(247,118,142,.08); border: 1px solid rgba(247,118,142,.2);
      color: var(--red); cursor: pointer; white-space: nowrap; margin-top: 10px;
      transition: background .12s, border-color .12s;
    }
    .trace-chip:hover { background: rgba(247,118,142,.18); border-color: rgba(247,118,142,.4); }

    .thinking {
      display: flex; gap: 4px; align-items: center; padding: 12px 14px;
      background: var(--bg-active); border: 1px solid var(--border-md);
      border-radius: 2px 12px 12px 12px; align-self: flex-start;
    }
    .thinking span {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--text-3); animation: blink 1.2s infinite;
    }
    .thinking span:nth-child(2) { animation-delay: .2s; }
    .thinking span:nth-child(3) { animation-delay: .4s; }
    @keyframes blink { 0%,60%,100% { opacity:.25; } 30% { opacity:1; } }

    #input-area {
      border-top: 1px solid var(--border); padding: 12px 16px;
      display: flex; flex-direction: column; gap: 6px; flex-shrink: 0;
    }
    #input-wrap {
      display: flex; align-items: flex-end; gap: 8px;
      background: var(--bg-active); border: 1px solid var(--border-md);
      border-radius: 8px; padding: 8px 10px; transition: border-color .15s;
    }
    #input-wrap:focus-within { border-color: rgba(122,162,247,.4); }
    #chat-input {
      flex: 1; background: none; border: none; outline: none;
      color: var(--text-1); font-family: var(--font-ui); font-size: 14px;
      resize: none; max-height: 120px; scrollbar-width: thin;
    }
    #chat-input::placeholder { color: var(--text-3); }
    #send-btn {
      background: var(--blue); color: #16161e; border: none; border-radius: 5px;
      width: 30px; height: 30px; cursor: pointer; display: flex; align-items: center;
      justify-content: center; font-size: 15px; flex-shrink: 0; transition: opacity .15s;
    }
    #send-btn:hover { opacity: .82; }
    #send-btn:disabled { opacity: .35; cursor: default; }
    #input-hint { font-size: 11px; color: var(--text-3); }

    /* ── Divider ── */
    #divider {
      width: 4px; cursor: col-resize; background: transparent; flex-shrink: 0; transition: background .15s;
    }
    #divider:hover, #divider.dragging { background: var(--blue); }

    /* ── Right pane — canvas ── */
    #right-pane { flex: 1; min-width: 0; display: flex; flex-direction: column; overflow: hidden; position: relative; }

    /* Canvas tab bar */
    #ctx-bar {
      height: 36px; background: var(--bg-deep); border-bottom: 1px solid var(--border);
      display: flex; align-items: stretch; padding: 0 4px; gap: 2px; flex-shrink: 0;
    }
    .ctx-tab {
      display: flex; align-items: center; gap: 6px;
      padding: 0 12px; border: none; background: none; cursor: pointer;
      font-family: var(--font-ui); font-size: 12px; font-weight: 500;
      color: var(--text-3); border-radius: 4px; margin: 4px 0;
      transition: color .12s, background .12s; white-space: nowrap;
    }
    .ctx-tab:hover { color: var(--text-1); background: var(--bg-hover); }
    .ctx-tab.active { color: var(--blue); background: rgba(122,162,247,.1); }
    .ctx-tab .tab-close {
      font-size: 13px; color: var(--text-3); line-height: 1;
      padding: 0 0 0 2px; transition: color .12s;
    }
    .ctx-tab .tab-close:hover { color: var(--red); }
    /* code overlay back button */
    #ctx-back {
      display: none; align-items: center; gap: 5px;
      padding: 0 12px; border: none; background: none; cursor: pointer;
      font-family: var(--font-ui); font-size: 12px; color: var(--text-2);
      border-right: 1px solid var(--border); flex-shrink: 0;
      transition: color .12s, background .12s;
    }
    #ctx-back:hover { color: var(--text-1); background: var(--bg-hover); }
    #ctx-back.visible { display: flex; }
    #ctx-code-label {
      font-family: var(--font-code); font-size: 11.5px; color: var(--text-2);
      padding: 0 8px; display: none; align-items: center;
    }
    #ctx-code-label.visible { display: flex; }
    #ctx-code-label .hl  { color: var(--cyan); }
    #ctx-code-label .dim { color: var(--text-3); }

    /* Canvas layers — all stacked, only one visible */
    .canvas-layer {
      position: absolute; inset: 36px 0 0 0;
      display: flex; flex-direction: column; overflow: hidden;
      opacity: 0; pointer-events: none;
      transition: opacity .18s ease, transform .18s ease;
      transform: translateY(6px);
    }
    .canvas-layer.active {
      opacity: 1; pointer-events: all; transform: translateY(0);
    }

    /* ── Architecture ── */
    #layer-arch { background: var(--bg-main); }
    #arch-toolbar {
      position: absolute; top: 10px; right: 12px;
      display: flex; gap: 6px; z-index: 5;
      align-items: center; flex-wrap: wrap;
      background: rgba(22,22,30,.75); padding: 6px 10px;
      border: 1px solid var(--border); border-radius: 6px;
      backdrop-filter: blur(6px);
    }
    #arch-counts {
      font-family: var(--font-code); font-size: 11px; color: var(--text-2);
      padding-right: 4px;
    }
    #arch-search {
      width: 200px; font-family: var(--font-ui); font-size: 12px;
      background: var(--bg-active); border: 1px solid var(--border-md);
      border-radius: 4px; color: var(--text-1); padding: 4px 8px; outline: none;
      transition: border-color .15s;
    }
    #arch-search:focus { border-color: rgba(122,162,247,.5); }
    #arch-search::placeholder { color: var(--text-3); }
    .arch-btn {
      background: var(--bg-raised); border: 1px solid var(--border-md);
      color: var(--text-2); font-size: 11px; font-family: var(--font-ui);
      padding: 4px 10px; border-radius: 4px; cursor: pointer; transition: background .12s;
    }
    .arch-btn:hover { background: var(--bg-hover); color: var(--text-1); }
    #arch-svg { width: 100%; height: 100%; display: block; cursor: grab; }
    #arch-svg:active { cursor: grabbing; }

    .arch-link { fill: none; stroke: rgba(255,255,255,0.08); stroke-width: 1; }
    .arch-node text {
      font-size: 11px; font-family: var(--font-code);
      user-select: none; pointer-events: none;
    }
    .arch-node-folder text { fill: var(--text-1); }
    .arch-node-file   text { fill: var(--text-2); }
    .arch-node-match  text { fill: var(--red) !important; font-weight: 600; }
    .arch-node-match circle { stroke: var(--red) !important; stroke-width: 2 !important; }

    /* ── Code viewer ── */
    #layer-code { background: var(--bg-main); }
    #code-header {
      background: var(--bg-deep); border-bottom: 1px solid var(--border);
      padding: 7px 16px; display: flex; align-items: center; gap: 10px; flex-shrink: 0;
    }
    #code-file-path { font-family: var(--font-code); font-size: 12px; color: var(--text-2); }
    #code-file-path .fname { color: var(--cyan); }
    #code-lang-badge {
      margin-left: auto; font-family: var(--font-code); font-size: 10px;
      padding: 2px 6px; border-radius: 3px;
      background: rgba(122,162,247,.1); color: var(--blue); border: 1px solid rgba(122,162,247,.2);
    }
    #code-scroll {
      flex: 1; overflow: auto;
      scrollbar-width: thin; scrollbar-color: var(--bg-hover) transparent;
    }
    #code-lines { padding: 12px 0; }
    .code-line { display: flex; min-width: max-content; }
    .line-num {
      width: 52px; flex-shrink: 0; text-align: right; padding-right: 16px;
      color: var(--text-3); font-family: var(--font-code); font-size: 12px;
      user-select: none; line-height: 1.72;
    }
    .line-content {
      flex: 1; padding-right: 32px;
      font-family: var(--font-code); font-size: 12.5px; line-height: 1.72;
    }
    .line-hl { background: rgba(224,175,104,.1); border-left: 2px solid var(--yellow); }
    .line-hl .line-num { color: var(--yellow); }

    code[class*="language-"], pre[class*="language-"] {
      background: transparent !important; font-family: var(--font-code) !important;
      font-size: 12.5px !important; line-height: 1.72 !important; text-shadow: none !important;
    }

    /* ── Trace view ── */
    #layer-trace { background: var(--bg-main); }
    #trace-inner {
      flex: 1; overflow-y: auto; padding: 24px;
      scrollbar-width: thin; scrollbar-color: var(--bg-hover) transparent;
    }
    .trace-section-title {
      font-size: 11px; font-weight: 600; text-transform: uppercase;
      letter-spacing: .08em; color: var(--text-2); margin-bottom: 10px;
    }
    .trace-source-box {
      font-family: var(--font-code); font-size: 13px; color: var(--cyan);
      padding: 8px 14px; background: rgba(125,207,255,.07);
      border-radius: 6px; border-left: 3px solid var(--cyan); margin-bottom: 20px;
    }
    .trace-count { font-size: 12px; color: var(--text-2); margin-bottom: 14px; }
    .trace-list { display: flex; flex-direction: column; gap: 7px; }
    .trace-item {
      display: flex; align-items: center; gap: 10px; padding: 10px 14px;
      background: var(--bg-raised); border: 1px solid var(--border); border-radius: 7px;
      cursor: pointer; transition: border-color .12s, background .12s;
    }
    .trace-item:hover { border-color: var(--border-md); background: var(--bg-hover); }
    .trace-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .trace-dot.direct     { background: var(--red); }
    .trace-dot.transitive { background: var(--yellow); }
    .trace-path { font-family: var(--font-code); font-size: 12px; color: var(--text-1); }
    .trace-badge {
      margin-left: auto; font-size: 10px; padding: 2px 7px; border-radius: 3px;
    }
    .trace-badge.direct     { background: rgba(247,118,142,.12); color: var(--red);    border: 1px solid rgba(247,118,142,.22); }
    .trace-badge.transitive { background: rgba(224,175,104,.12); color: var(--yellow); border: 1px solid rgba(224,175,104,.22); }

    /* ── Agent trace panel (inline in chat) ── */
    .agent-trace {
      margin-top: 10px; border-radius: 6px;
      background: rgba(255,255,255,.03); border: 1px solid var(--border);
      font-size: 12px;
    }
    .agent-trace summary {
      cursor: pointer; padding: 6px 10px; color: var(--text-2);
      font-family: var(--font-code); font-size: 11px;
      user-select: none; list-style: none;
    }
    .agent-trace summary::-webkit-details-marker { display: none; }
    .agent-trace summary::before {
      content: "▶ "; font-size: 9px; margin-right: 4px;
      display: inline-block; transition: transform .15s;
    }
    .agent-trace[open] summary::before { transform: rotate(90deg); }
    .agent-trace-steps { padding: 6px 10px 10px; display: flex; flex-direction: column; gap: 6px; }
    .trace-step {
      background: rgba(255,255,255,.03); border: 1px solid var(--border);
      border-radius: 4px; overflow: hidden;
    }
    .trace-step-tool {
      font-family: var(--font-code); font-size: 11px; color: var(--purple);
      padding: 5px 8px; background: rgba(187,154,247,.06);
      border-bottom: 1px solid var(--border);
    }
    .trace-step-result {
      font-family: var(--font-code); font-size: 11px; color: var(--text-2);
      padding: 5px 8px; max-height: 120px; overflow-y: auto;
      white-space: pre-wrap; word-break: break-all;
      scrollbar-width: thin; scrollbar-color: var(--bg-hover) transparent;
    }

    /* ── Live agent steps (shown inline during streaming) ── */
    .agent-live-steps { display: flex; flex-direction: column; gap: 4px; }
    .agent-live-step {
      display: flex; align-items: center; gap: 8px;
      font-family: var(--font-code); font-size: 11px; color: var(--text-2);
      padding: 4px 0;
    }
    .agent-live-step .step-icon {
      width: 16px; height: 16px; border-radius: 50%; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center; font-size: 10px;
    }
    .agent-live-step .step-icon.pending {
      border: 2px solid var(--blue); border-top-color: transparent;
      animation: spin .8s linear infinite;
    }
    .agent-live-step .step-icon.done { background: rgba(158,206,106,.15); color: var(--green); border: none; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .agent-live-step .step-label { color: var(--text-2); }
    .agent-live-step .step-label .tool-name { color: var(--purple); }

    /* ── Mode toggle ── */
    .mode-toggle {
      display: inline-flex; align-items: center; gap: 6px;
      font-family: var(--font-code); font-size: 11px;
      color: var(--text-2); cursor: pointer; user-select: none;
    }
    .mode-toggle input[type="checkbox"] {
      appearance: none; -webkit-appearance: none; width: 28px; height: 16px;
      border-radius: 8px; background: var(--bg-active); border: 1px solid var(--border-md);
      position: relative; cursor: pointer; transition: background .15s;
    }
    .mode-toggle input[type="checkbox"]::after {
      content: ""; position: absolute; top: 2px; left: 2px;
      width: 10px; height: 10px; border-radius: 50%;
      background: var(--text-3); transition: transform .15s, background .15s;
    }
    .mode-toggle input[type="checkbox"]:checked {
      background: rgba(187,154,247,.2); border-color: rgba(187,154,247,.4);
    }
    .mode-toggle input[type="checkbox"]:checked::after {
      transform: translateX(12px); background: var(--purple);
    }

    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--bg-hover); border-radius: 3px; }
  </style>
</head>
<body>

<div id="topbar">
  <span class="logo">⬡ Nemotron RAG</span>
  <span class="sep">/</span>
  <span class="repo" id="topbar-repo">loading…</span>
  <span class="indexed-badge" id="topbar-indexed"></span>
</div>

<div id="app">

  <!-- LEFT: Chat -->
  <div id="left-pane">
    <div id="chat-header">
      <h2>Assistant</h2>
      <div class="chat-toggles">
        <label class="mode-toggle" title="Agent mode: iteratively explores the codebase using tools">
          <input type="checkbox" id="agent-mode-toggle" checked>
          <span>Agent</span>
        </label>
      </div>
      <span class="scope-pill">⊙ Whole codebase</span>
    </div>
    <div id="messages"></div>
    <div id="input-area">
      <div id="input-wrap">
        <textarea id="chat-input" rows="1" placeholder="Ask anything about this codebase…"></textarea>
        <button id="send-btn">↑</button>
      </div>
      <span id="input-hint">Enter to send · Shift+Enter for newline</span>
    </div>
  </div>

  <div id="divider"></div>

  <!-- RIGHT: Canvas -->
  <div id="right-pane">

    <!-- Tab bar + code overlay header -->
    <div id="ctx-bar">
      <!-- persistent tabs -->
      <button class="ctx-tab active" id="tab-arch">⬡ Architecture</button>
      <!-- trace tab injected by JS when a trace result arrives -->
      <!-- code overlay controls (shown only when code layer is active) -->
      <button id="ctx-back">← back</button>
      <span id="ctx-code-label"></span>
      <!-- arch toolbar, right-aligned, hidden when not on arch -->
    </div>

    <!-- Layer: architecture (default) -->
    <div class="canvas-layer active" id="layer-arch">
      <div id="arch-toolbar">
        <span id="arch-counts"></span>
        <input type="text" id="arch-search" placeholder="Search files and folders…"
               oninput="archSearch(this.value)">
        <button class="arch-btn" onclick="archExpandAll()">Expand all</button>
        <button class="arch-btn" onclick="archCollapseAll()">Collapse all</button>
        <button class="arch-btn" onclick="resetArchZoom()">Reset zoom</button>
      </div>
      <svg id="arch-svg"></svg>
    </div>

    <!-- Layer: code viewer -->
    <div class="canvas-layer" id="layer-code">
      <div id="code-header">
        <span id="code-file-path"></span>
        <span id="code-lang-badge"></span>

let currentLayer = "arch";   // "arch" | "trace" | "code"
let prevNonCodeLayer = "arch"; // remembers which tab to return to from code

function activateTab(name) {
  // Only arch and trace are tabs; code is an overlay
  document.querySelectorAll(".ctx-tab").forEach(t => t.classList.remove("active"));
  const tab = document.getElementById(`tab-${name}`);
  if (tab) tab.classList.add("active");

  document.querySelectorAll(".canvas-layer").forEach(l => l.classList.remove("active"));
  document.getElementById(`layer-${name}`).classList.add("active");
  currentLayer = name;

  // Arch toolbar only when on arch
  document.getElementById("arch-toolbar").style.display = name === "arch" ? "flex" : "none";
  // Code overlay controls hidden
  document.getElementById("ctx-back").classList.remove("visible");
  document.getElementById("ctx-code-label").classList.remove("visible");
}

function showCodeOverlay(filePath, label) {
  prevNonCodeLayer = currentLayer === "code" ? prevNonCodeLayer : currentLayer;
  document.querySelectorAll(".ctx-tab").forEach(t => t.classList.remove("active"));
  document.querySelectorAll(".canvas-layer").forEach(l => l.classList.remove("active"));
  document.getElementById("layer-code").classList.add("active");
  currentLayer = "code";

  document.getElementById("arch-toolbar").style.display = "none";
  document.getElementById("ctx-back").classList.add("visible");
  const lbl = document.getElementById("ctx-code-label");
  lbl.innerHTML = label;
  lbl.classList.add("visible");
}

document.getElementById("ctx-back").addEventListener("click", () => {
  activateTab(prevNonCodeLayer);
});

document.getElementById("tab-arch").addEventListener("click", () => activateTab("arch"));

// ── Code viewer ────────────────────────────────────────────────────────────────

async function openCodeViewer(filePath, targetLine) {
  let file = FILES[filePath];
  if (!file && REPO_ID) {
    try {
      const res = await fetch(`${API}/file/${encodeURIComponent(REPO_ID)}?path=${encodeURIComponent(filePath)}`);
      if (res.ok) {
        const data = await res.json();
        file = { language: data.language, content: data.content };
        FILES[filePath] = file;
      }
    } catch (_) { /* skip */ }
  }
  if (!file) return;

  const parts = filePath.split("/");
  const fname = parts.pop();
  document.getElementById("code-file-path").innerHTML =
    parts.map(p => `<span style="color:var(--text-3)">${esc(p)}/</span>`).join("") +
    `<span class="fname">${esc(fname)}</span>`;
  document.getElementById("code-lang-badge").textContent = file.language;

  const linesEl = document.getElementById("code-lines");
  linesEl.innerHTML = "";
  const grammar = Prism.languages[file.language] || Prism.languages.clike;
  file.content.split("\n").forEach((raw, i) => {
    const n = i + 1;
    const hl = targetLine && n === targetLine;
    const row = document.createElement("div");
    row.className = "code-line" + (hl ? " line-hl" : "");
    row.dataset.line = n;
    row.innerHTML =
      `<span class="line-num">${n}</span>` +
      `<span class="line-content language-${file.language}">${Prism.highlight(raw, grammar, file.language) || " "}</span>`;
    linesEl.appendChild(row);
  });

  const pathLabel = `<span class="dim">${parts.join("/")}/</span><span class="hl">${esc(fname)}</span>` +
    (targetLine ? `<span class="dim">:${targetLine}</span>` : "");
  showCodeOverlay(filePath, pathLabel);

  if (targetLine) {
    requestAnimationFrame(() => {
      const scroll = document.getElementById("code-scroll");
      const hlRow = linesEl.querySelector(`[data-line="${targetLine}"]`);
      if (hlRow) scroll.scrollTop = Math.max(0, hlRow.offsetTop - scroll.clientHeight / 2.5);
    });
  }
}

// ── Trace view ─────────────────────────────────────────────────────────────────

function openTrace(source, affected) {
  document.getElementById("trace-source-label").textContent = source;
  document.getElementById("trace-count-label").textContent =
    `${affected.length} file(s) import this module directly or transitively`;

  const list = document.getElementById("trace-list");
  list.innerHTML = "";
  affected.forEach(item => {
    const el = document.createElement("div");
    el.className = "trace-item";
    el.innerHTML = `<span class="trace-dot ${item.type}"></span>
      <span class="trace-path">${esc(item.path)}</span>
      <span class="trace-badge ${item.type}">${item.type}</span>`;
    el.addEventListener("click", () => openCodeViewer(item.path, 1));
    list.appendChild(el);
  });

  // Inject trace tab if not already present
  if (!document.getElementById("tab-trace")) {
    const tab = document.createElement("button");
    tab.className = "ctx-tab";
    tab.id = "tab-trace";
    const srcName = source.split("/").pop();
    tab.innerHTML = `⇢ ${esc(srcName)} <span class="tab-close" title="Close">×</span>`;
    tab.addEventListener("click", e => {
      if (e.target.classList.contains("tab-close")) {
        tab.remove();
        if (currentLayer === "trace") activateTab("arch");
      } else {
        activateTab("trace");
      }
    });
    document.getElementById("tab-arch").insertAdjacentElement("afterend", tab);
  } else {
    const srcName = source.split("/").pop();
    document.getElementById("tab-trace").innerHTML =
      `⇢ ${esc(srcName)} <span class="tab-close" title="Close">×</span>`;
  }
  activateTab("trace");
}

// ── Chat ───────────────────────────────────────────────────────────────────────

const messagesEl = document.getElementById("messages");
const inputEl    = document.getElementById("chat-input");
const sendBtn    = document.getElementById("send-btn");

// Conversation history sent to the backend. Raw text only (no HTML).
// Mirrors the Turn schema in app/query.py.
const chatHistory = [];
const HISTORY_TURNS_TO_SEND = 6;

function esc(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function appendMsg(role, html, response) {
  const wrap = document.createElement("div");
  wrap.className = `msg msg-${role}`;

  const label = document.createElement("span");
  label.className = "msg-label";
  label.textContent = role === "user" ? "You" : "Nemotron";
  wrap.appendChild(label);

  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.innerHTML = html;

  if (response) {
    if (response.type === "answer" && response.mode_used) {
      const badge = document.createElement("div");
      badge.className = "mode-badge " + response.mode_used;
      badge.textContent = response.mode_used === "deep" ? "deep · 49B + RAG" : "fast · 8B";
      bubble.appendChild(badge);
    }
    if (response.type === "answer" && response.citations?.length) {
      const chips = document.createElement("div");
      chips.className = "citations";
      response.citations.forEach(c => {
        const chip = document.createElement("span");
        chip.className = "cite-chip";
        chip.textContent = `${c.path}:${c.line}`;
        chip.addEventListener("click", () => openCodeViewer(c.path, c.line));
        chips.appendChild(chip);
      });
      bubble.appendChild(chips);
    }
    if (response.type === "trace" && response.affected) {
      const chip = document.createElement("span");
      chip.className = "trace-chip";
      chip.innerHTML = `⇢ View dependency trace for ${esc(response.source.split("/").pop())}`;
      chip.addEventListener("click", () => openTrace(response.source, response.affected));
      bubble.appendChild(chip);
    }
  }

  wrap.appendChild(bubble);
  messagesEl.appendChild(wrap);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function showThinking() {
  const wrap = document.createElement("div");
  wrap.className = "msg msg-assistant"; wrap.id = "_thinking";
  const b = document.createElement("div"); b.className = "thinking";
  b.innerHTML = "<span></span><span></span><span></span>";
  wrap.appendChild(b); messagesEl.appendChild(wrap);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}
function removeThinking() { document.getElementById("_thinking")?.remove(); }

function formatAnswer(text) {
  let html = esc(text);
  // Fenced code blocks
  html = html.replace(/```[\w]*\n([\s\S]*?)```/g, (_, code) =>
    `<pre style="background:rgba(255,255,255,.05);padding:10px 14px;border-radius:6px;overflow-x:auto;font-family:var(--font-code);font-size:12px;margin:8px 0;white-space:pre-wrap"><code>${code}</code></pre>`);
  // Inline code
  html = html.replace(/`([^`\n]+)`/g, '<code>$1</code>');
  // Newlines
  html = html.replace(/\n/g, '<br>');
  return html;
}

function createStreamingBubble() {
  /* Build an empty assistant bubble we'll fill in as tokens stream in.
     Returns refs to the bubble (for content) and wrap (for badges/chips). */
  const wrap = document.createElement("div");
  wrap.className = "msg msg-assistant";
  const label = document.createElement("span");
  label.className = "msg-label";
  label.textContent = "Nemotron";
  wrap.appendChild(label);
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  const body = document.createElement("div");
  body.className = "bubble-body";
  bubble.appendChild(body);
  wrap.appendChild(bubble);
  messagesEl.appendChild(wrap);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return { wrap, bubble, body };
}

function attachAssistantExtras(bubble, citations, toolTrace) {
  if (citations && citations.length) {
    const chips = document.createElement("div");
    chips.className = "citations";
    citations.forEach(c => {
      const chip = document.createElement("span");
      chip.className = "cite-chip";
      chip.textContent = `${c.file_path}:${c.start_line}`;
      chip.addEventListener("click", () => openCodeViewer(c.file_path, c.start_line));
      chips.appendChild(chip);
    });
    bubble.appendChild(chips);
  }

  if (toolTrace && toolTrace.length) {
    const details = document.createElement("details");
    details.className = "agent-trace";
    const summary = document.createElement("summary");
    summary.textContent = `Used ${toolTrace.length} tool${toolTrace.length !== 1 ? "s" : ""}`;
    details.appendChild(summary);

    const stepsDiv = document.createElement("div");
    stepsDiv.className = "agent-trace-steps";
    toolTrace.forEach(step => {
      const stepEl = document.createElement("div");
      stepEl.className = "trace-step";

      const toolEl = document.createElement("div");
      toolEl.className = "trace-step-tool";
      const argsStr = step.args ? JSON.stringify(step.args) : "";
      toolEl.textContent = `${step.name}(${argsStr})`;
      stepEl.appendChild(toolEl);

      const resultEl = document.createElement("div");
      resultEl.className = "trace-step-result";
      resultEl.textContent = step.result || "(no output)";
      stepEl.appendChild(resultEl);

      stepsDiv.appendChild(stepEl);
    });
    details.appendChild(stepsDiv);
    bubble.appendChild(details);
  }
}

function showStatus(bubbleRefs, text) {
  bubbleRefs.body.innerHTML = `<span class="stream-status">${esc(text)}</span>`;
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function _renderLiveSteps(bodyEl, steps, statusText) {
  let html = '<div class="agent-live-steps">';
  steps.forEach((step, i) => {
    const isDone = step.result !== null;
    const iconClass = isDone ? "done" : "pending";
    const iconContent = isDone ? "✓" : "";
    const argsSnippet = step.args ? Object.values(step.args).join(", ") : "";
    const label = `<span class="tool-name">${esc(step.name)}</span>` +
      (argsSnippet ? `(<span style="color:var(--text-3)">${esc(argsSnippet.slice(0, 50))}</span>)` : "");
    html += `<div class="agent-live-step">
      <span class="step-icon ${iconClass}">${iconContent}</span>
      <span class="step-label">${label}</span>
    </div>`;
  });
  html += '</div>';
  if (statusText) {
    html += `<span class="stream-status" style="margin-top:6px">${esc(statusText)}</span>`;
  }
  bodyEl.innerHTML = html;
}

// Rotating status phrases shown client-side between backend status events
const _WAITING_PHRASES = [
  "Reading through the code…",
  "Looking deeper…",
  "Almost there…",
  "Still working on it…",
  "Checking a few more things…",
  "Piecing things together…",
];
let _statusTimer = null;
function _startStatusRotation(bubbleRefs, liveSteps, isAgent) {
  _stopStatusRotation();
  let idx = 0;
  _statusTimer = setInterval(() => {
    const phrase = _WAITING_PHRASES[idx % _WAITING_PHRASES.length];
    idx++;
    if (isAgent && liveSteps.length > 0) {
      _renderLiveSteps(bubbleRefs.body, liveSteps, phrase);
    } else {
      showStatus(bubbleRefs, phrase);
    }
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }, 3000);
}
function _stopStatusRotation() {
  if (_statusTimer) { clearInterval(_statusTimer); _statusTimer = null; }
}

async function sendMessage() {
  const text = inputEl.value.trim();
  if (!text) return;
  inputEl.value = ""; inputEl.style.height = "auto";
  sendBtn.disabled = true;
  appendMsg("user", esc(text));

  const historyToSend = chatHistory.slice(-HISTORY_TURNS_TO_SEND);
  chatHistory.push({ role: "user", content: text });

  let accumulated = "";
  let finalAnswer = null;
  let citations = [];
  let toolTrace = [];
  let sawFirstToken = false;
  let liveSteps = [];
  let lastStatus = "";

  const bubbleRefs = createStreamingBubble();
  const endpoint = useAgentMode ? "/agent" : "/query";
  const isAgent = useAgentMode;
  showStatus(bubbleRefs, isAgent ? "Analyzing your question…" : "Sending…");
  _startStatusRotation(bubbleRefs, liveSteps, isAgent);

  try {
    const res = await fetch(`${API}${endpoint}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        repo_id: REPO_ID,
        question: text,
        scope: currentScope || null,
        history: historyToSend,
      }),
    });
    if (!res.ok) {
      const errBody = await res.json().catch(() => ({}));
      throw new Error(errBody.detail || `HTTP ${res.status}`);
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split("\n");
      buffer = lines.pop();
      for (const line of lines) {
        if (!line.trim()) continue;
        let event;
        try { event = JSON.parse(line); }
        catch { continue; }

        if (event.type === "status") {
          lastStatus = event.text;
          _stopStatusRotation();
          if (!sawFirstToken) {
            if (isAgent && liveSteps.length > 0) {
              _renderLiveSteps(bubbleRefs.body, liveSteps, lastStatus);
            } else {
              showStatus(bubbleRefs, lastStatus);
            }
          }
          _startStatusRotation(bubbleRefs, liveSteps, isAgent);
        } else if (event.type === "tool_call") {
          _stopStatusRotation();
          liveSteps.push({ name: event.name, args: event.args, result: null });
          toolTrace.push({ name: event.name, args: event.args, result: "" });
          if (!sawFirstToken) {
            _renderLiveSteps(bubbleRefs.body, liveSteps, lastStatus);
          }
          _startStatusRotation(bubbleRefs, liveSteps, isAgent);
        } else if (event.type === "tool_result") {
          _stopStatusRotation();
          const ix = typeof event.idx === "number" ? event.idx : liveSteps.length - 1;
          const liveStep = liveSteps[ix];
          if (liveStep) liveStep.result = event.result ?? "(done)";
          const traceStep = typeof event.idx === "number" ? toolTrace[event.idx] : toolTrace[toolTrace.length - 1];
          if (traceStep) traceStep.result = event.result ?? "";
          if (!sawFirstToken) {
            _renderLiveSteps(bubbleRefs.body, liveSteps, "");
          }
          _startStatusRotation(bubbleRefs, liveSteps, isAgent);
        } else if (event.type === "token") {
          _stopStatusRotation();
          if (!sawFirstToken) {
            bubbleRefs.body.innerHTML = "";
            bubbleRefs.body.classList.add("streaming-cursor");
            sawFirstToken = true;
          }
          accumulated += event.text;
          bubbleRefs.body.innerHTML = formatAnswer(accumulated);
        } else if (event.type === "done") {
          _stopStatusRotation();
          bubbleRefs.body.classList.remove("streaming-cursor");
          finalAnswer = event.answer || accumulated || "(no response)";
          citations = event.citations || [];
          if (event.tool_trace && event.tool_trace.length) toolTrace = event.tool_trace;
          bubbleRefs.body.innerHTML = formatAnswer(finalAnswer);
          attachAssistantExtras(bubbleRefs.bubble, citations, toolTrace);
        } else if (event.type === "error") {
          _stopStatusRotation();
          bubbleRefs.body.classList.remove("streaming-cursor");
          const msg = `<span style="color:var(--red)">${esc(event.message)}</span>`;
          bubbleRefs.body.innerHTML = (accumulated ? formatAnswer(accumulated) + "<br>" : "") + msg;
        }
      }
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    chatHistory.push({ role: "assistant", content: finalAnswer ?? accumulated });
  } catch (err) {
    _stopStatusRotation();
    bubbleRefs.body.classList.remove("streaming-cursor");
    bubbleRefs.body.innerHTML = `<span style="color:var(--red)">${esc(String(err.message || err))}</span>`;
    chatHistory.pop();
  } finally {
    _stopStatusRotation();
    sendBtn.disabled = false;
  }
}

sendBtn.addEventListener("click", sendMessage);
inputEl.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); } });
inputEl.addEventListener("input", () => { inputEl.style.height = "auto"; inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + "px"; });

// Update topbar repo label immediately
document.getElementById("topbar-repo").textContent = REPO_LABEL;

// Seed — fetch file count then greet
(async () => {
  try {
    const res = await fetch(`${API}/files/${encodeURIComponent(REPO_ID)}`);
    const data = res.ok ? await res.json() : null;
    const count = data?.files?.length ?? "?";
    document.getElementById("topbar-indexed").textContent = `● ${count} files indexed`;
    appendMsg("assistant",
      `I've indexed <strong>${count} file${count !== 1 ? "s" : ""}</strong> from <code>${esc(REPO_LABEL)}</code>. Ask me anything — how a function works, what a module exports, or what depends on a given file.`,
      null);
  } catch {
    appendMsg("assistant",
      `Ready. Ask me anything about <code>${esc(REPO_LABEL)}</code>.`,
      null);
  }
})();

// ── Architecture D3 (ARCH-02) ─────────────────────────────────────────────────

const LANGUAGE_COLORS = {
  python:     "#4B8BBE",
  javascript: "#F7DF1E",
  typescript: "#3178C6",
  tsx:        "#61DAFB",
  go:         "#00ADD8",
  rust:       "#CE422B",
  java:       "#B07219",
  cpp:        "#F34B7D",
  c_sharp:    "#178600",
  unknown:    "#888888",
};

let _archRoot = null;
let _archSvgSel = null;
let _archZoom = null;
let _archData = null;
let _archRendered = false;
const ARCH_NODE_WIDTH = 220;
const ARCH_NODE_HEIGHT = 22;

// The code viewer alias — the spec uses window.__openCodeViewer
window.__openCodeViewer = (filePath, startLine) => openCodeViewer(filePath, startLine);

async function loadArchDiagram(repoId) {
  if (_archData) { _renderArch(); return; }
  try {
    const res = await fetch(`${API}/architecture/${encodeURIComponent(repoId)}`);
    if (!res.ok) throw new Error("Architecture data unavailable");
    _archData = await res.json();
    const counts = document.getElementById("arch-counts");
    if (counts) counts.textContent =
      `${_archData.total_files} files · ${_archData.total_folders} folders`;
    _renderArch();
  } catch (err) {
    console.error("Architecture diagram:", err.message);
  }
}

function _renderArch() {
  _archRendered = true;
  const container = document.getElementById("layer-arch");
  const W = container.clientWidth  || 900;
  const H = container.clientHeight || 620;

  _archSvgSel = d3.select("#arch-svg").attr("viewBox", [0, 0, W, H]);
  _archSvgSel.selectAll("*").remove();

  const g = _archSvgSel.append("g").attr("transform", `translate(60, ${H / 2})`);
  _archSvgSel._g = g;

  _archZoom = d3.zoom().scaleExtent([0.05, 3]).on("zoom", e => g.attr("transform", e.transform));
  _archSvgSel.call(_archZoom);
  _archSvgSel.call(_archZoom.transform, d3.zoomIdentity.translate(60, H / 2));

  _archRoot = d3.hierarchy(_archData.tree, d => d.children);
  _archRoot.x0 = 0;
  _archRoot.y0 = 0;

  // Collapse all folders except root so large repos stay readable
  _archRoot.descendants().forEach(d => {
    if (d.depth > 0 && d.data.type === "folder" && d.children) {
      d._children = d.children;
      d.children = null;
    }
  });

  _archUpdate(_archRoot, g);
}

function _archUpdate(source, g) {
  const treeLayout = d3.tree().nodeSize([ARCH_NODE_HEIGHT + 4, ARCH_NODE_WIDTH]);
  treeLayout(_archRoot);

  const nodes = _archRoot.descendants();
  const links = _archRoot.links();
  const duration = 300;

  // Links
  const link = g.selectAll(".arch-link").data(links, d => d.target.data.id);

  link.join(
    enter => enter.append("path").attr("class", "arch-link")
      .attr("d", () => {
        const o = { x: source.x0 || 0, y: source.y0 || 0 };
        return _archLinkPath({ source: o, target: o });
      }),
    update => update,
    exit => exit.transition().duration(duration)
      .attr("d", () => {
        const o = { x: source.x, y: source.y };
        return _archLinkPath({ source: o, target: o });
      }).remove()
  ).transition().duration(duration).attr("d", _archLinkPath);

  // Nodes
  const node = g.selectAll(".arch-node").data(nodes, d => d.data.id);

  const nodeEnter = node.enter().append("g")
    .attr("class", d => `arch-node arch-node-${d.data.type}`)
    .attr("transform", () => `translate(${source.y0 || 0},${source.x0 || 0})`)
    .style("opacity", 0)
    .on("click", (e, d) => {
      if (d.data.type === "folder") {
        _archToggle(d);
        _archUpdate(d, g);
      } else {
        window.__openCodeViewer(d.data.id, 1);
      }
    });

  nodeEnter.append("circle")
    .attr("r", d => d.data.type === "folder" ? 8 : 5)
    .attr("fill", d => {
      if (d.data.type === "folder") return d._children ? "#374151" : "#6B7280";
      return LANGUAGE_COLORS[d.data.language] || LANGUAGE_COLORS.unknown;
    })
    .attr("stroke", "#1e1e2e")
    .attr("stroke-width", 1.5)
    .attr("cursor", "pointer");

  nodeEnter.append("text")
    .attr("x", d => d.data.type === "folder" ? 14 : 10)
    .attr("dy", "0.35em")
    .attr("cursor", "pointer")
    .text(d => {
      const n = d.data.name;
      return n.length > 28 ? n.slice(0, 25) + "…" : n;
    });

  nodeEnter.filter(d => d.data.type === "folder").append("text")
    .attr("class", "arch-expand-icon")
    .attr("x", -14).attr("dy", "0.35em")
    .attr("fill", "#6B7280").attr("font-size", "10px")
    .text(d => d._children ? "▶" : d.children ? "▼" : "");

  const nodeUpdate = nodeEnter.merge(node);
  nodeUpdate.transition().duration(duration)
    .attr("transform", d => `translate(${d.y},${d.x})`)
    .style("opacity", 1);

  nodeUpdate.select("circle")
    .attr("fill", d => {
      if (d.data.type === "folder") return d._children ? "#374151" : "#6B7280";
      return LANGUAGE_COLORS[d.data.language] || LANGUAGE_COLORS.unknown;
    });
  nodeUpdate.select(".arch-expand-icon")
    .text(d => d._children ? "▶" : d.children ? "▼" : "");

  node.exit().transition().duration(duration)
    .attr("transform", () => `translate(${source.y},${source.x})`)
    .style("opacity", 0).remove();

  nodes.forEach(d => { d.x0 = d.x; d.y0 = d.y; });
}

function _archLinkPath(d) {
  return `M ${d.target.y} ${d.target.x}
          C ${(d.target.y + d.source.y) / 2} ${d.target.x},
            ${(d.target.y + d.source.y) / 2} ${d.source.x},
            ${d.source.y} ${d.source.x}`;
}

function _archToggle(d) {
  if (d.children) {
    d._children = d.children;
    d.children = null;
  } else {
    d.children = d._children;
    d._children = null;
  }
}

function archExpandAll() {
  if (!_archRoot || !_archSvgSel) return;
  _archRoot.descendants().forEach(d => {
    if (d._children) { d.children = d._children; d._children = null; }
  });
  _archUpdate(_archRoot, _archSvgSel._g);
}

function archCollapseAll() {
  if (!_archRoot || !_archSvgSel) return;
  _archRoot.descendants().forEach(d => {
    if (d.depth > 0 && d.children) { d._children = d.children; d.children = null; }
  });
  _archUpdate(_archRoot, _archSvgSel._g);
}

function resetArchZoom() {
  if (_archZoom && _archSvgSel) {
    const H = document.getElementById("layer-arch").clientHeight || 620;
    _archSvgSel.transition().duration(300)
      .call(_archZoom.transform, d3.zoomIdentity.translate(60, H / 2));
  }
}

function archSearch(query) {
  if (!_archRoot || !_archSvgSel) return;
  const q = query.toLowerCase().trim();
  if (q) archExpandAll();
  _archSvgSel.selectAll(".arch-node")
    .classed("arch-node-match", d => q.length > 0 && d.data.name.toLowerCase().includes(q));
  if (!q) {
    _archSvgSel.selectAll(".arch-node").classed("arch-node-match", false);
  }
}

// Kick off the initial load
if (REPO_ID) loadArchDiagram(REPO_ID);

// ── Resizable divider ──────────────────────────────────────────────────────────

const divider  = document.getElementById("divider");
const leftPane = document.getElementById("left-pane");
let dragging   = false;
divider.addEventListener("mousedown", () => {
  dragging = true; divider.classList.add("dragging");
  document.body.style.cssText += ";cursor:col-resize;user-select:none";
});
document.addEventListener("mousemove", e => {
  if (!dragging) return;
  const rect = document.getElementById("app").getBoundingClientRect();
  leftPane.style.width = Math.max(260, Math.min(e.clientX - rect.left, rect.width * 0.65)) + "px";
});
document.addEventListener("mouseup", () => {
  if (!dragging) return;
  dragging = false; divider.classList.remove("dragging");
  document.body.style.cursor = ""; document.body.style.userSelect = "";
});

// Init
activateTab("arch");
</script>
